}
function fmtStars(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(n)}
function catMeta(id){var c=(state.data.categories||[]).find(function(x){return x.id===id});return c||{emoji:"📦",zh:id,en:id}}

function matches(s){
 if(state.cat!=="all"&&s.category!==state.cat)return false;
 if(!state.q)return true;
 var q=state.q.toLowerCase();
 return [s.name,s.title_zh,s.tagline_zh,s.tagline_en,s.desc_en,s.repo,s.owner].join(" ").toLowerCase().indexOf(q)>=0;
}

function render(){
 var d=state.data;if(!d)return;
 document.documentElement.lang=state.lang==="zh"?"zh-CN":"en";
 document.getElementById("langZh").style.opacity=state.lang==="zh"?1:.55;
 document.getElementById("langEn").style.opacity=state.lang==="en"?1:.55;
 document.getElementById("footAbout").textContent=t("about");
 document.getElementById("footProto").textContent=t("proto");
 document.getElementById("q").placeholder=state.lang==="zh"?"搜点好玩的… / search":"Search the shelves…";

 // status strip
 var day=(d.generated_at||"").slice(0,10);
 document.getElementById("strip").innerHTML='<span><span class="dot"></span><b>'+d.count+"</b> "+t("total")+"</span>"+
   ((d.new_today&&d.new_today<d.count)?('<span>🧧 '+t("newToday")+" <b>"+d.new_today+"</b> "+t("items")+"</span>"):"")+
   "<span>★ "+d.picks+" "+t("picks")+"</span><span>"+t("updated")+" "+esc(day)+" UTC</span>";

 // chips
 var chips=document.getElementById("chips");chips.innerHTML="";
 var mk=function(id,label,n){var b=el('<button class="chip'+(state.cat===id?" on":"")+'" role="tab">'+label+(n!=null?' <span class="c">'+n+"</span>":"")+"</button>");b.onclick=function(){state.cat=id;render()};chips.appendChild(b)};
 mk("all",t("all"),d.count);
 d.categories.forEach(function(c){if(c.count>0)mk(c.id,c.emoji+" "+(state.lang==="zh"?c.zh:c.en),c.count)});

 var app=document.getElementById("app");app.innerHTML="";
 var list=d.skills.filter(matches);
 var todayStr=day;
 var isFresh=function(s){return s.added_at===todayStr&&d.new_today>0&&d.new_today<d.count};

 if(!list.length){app.appendChild(el('<div class="empty"><div class="big">'+t("searchEmptyBig")+'</div><div>'+t("searchEmpty")+"</div></div>"));return}

 var noFilter=(state.cat==="all"&&!state.q);
 if(noFilter){
  var freshOnes=d.skills.filter(isFresh);
  if(freshOnes.length){
   app.appendChild(el('<div class="shelf-label"><h2>'+t("newShelf")+'</h2><span class="n">'+freshOnes.length+"</span></div>"));
   var row=el('<div class="row"></div>');freshOnes.forEach(function(s){row.appendChild(card(s,true))});app.appendChild(row);
  }
  var picks=d.skills.filter(function(s){return s.pick});
  if(picks.length){
   app.appendChild(el('<div class="shelf-label"><h2>'+t("picksShelf")+'</h2><span class="n">'+picks.length+"</span></div>"));
   var g=el('<div class="grid"></div>');picks.forEach(function(s){g.appendChild(card(s,false))});app.appendChild(g);
  }
  d.categories.forEach(function(c){
   var items=d.skills.filter(function(s){return s.category===c.id&&!s.pick});
   if(!items.length)return;
   app.appendChild(el('<div class="shelf-label"><h2>'+c.emoji+" "+(state.lang==="zh"?c.zh:c.en)+'</h2><span class="en">'+(state.lang==="zh"?c.en:c.zh)+'</span><span class="n">'+items.length+"</span></div>"));
   var g2=el('<div class="grid"></div>');items.forEach(function(s){g2.appendChild(card(s,isFresh(s)))});app.appendChild(g2);
  });
 }else{
  var g3=el('<div class="grid" style="margin-top:20px"></div>');list.forEach(function(s){g3.appendChild(card(s,false))});app.appendChild(g3);
 }
}

/* receipt */
function openReceipt(s){
 var r=document.getElementById("receipt");
 var now=new Date();var stamp=now.toISOString().slice(0,16).replace("T"," ");
 var no=(s.id.split("").reduce(function(a,c){return a+c.charCodeAt(0)},0)%9000+1000);
 var cmds=[s.install.clone,s.install.copy];
 r.innerHTML='<button class="r-close" aria-label="close">✕</button>'+
  '<div class="r-head"><div class="shop">🏪 Skill 商店</div><div class="tiny">SKILL STORE · RECEIPT №'+no+"</div></div>"+
  '<div class="r-line"><span class="r-item-zh">'+esc(title(s))+'</span><b>'+t("free")+"</b></div>"+
  '<div class="r-item-en">'+esc(s.repo)+(s.path?" / "+esc(s.path):"")+"</div>"+
  '<div class="r-desc">'+esc(tagline(s))+(state.lang==="zh"&&s.desc_en?"\n\n"+esc(s.desc_en):"")+"</div>"+
  ((s.pick&&why(s))?'<div class="r-sep"></div><div class="r-desc">💬 '+t("why")+"："+esc(why(s))+"</div>":"")+
  '<div class="r-sep"></div><div style="text-align:center;font-weight:700;letter-spacing:.18em">'+t("installTitle")+"</div>"+
  '<div class="r-step">'+t("stepCode")+"</div>"+
  cmds.map(function(c){return '<div class="cmd">'+esc(c)+'<button class="copy" data-c="'+esc(c)+'">copy</button></div>'}).join("")+
  '<div class="r-note">→ '+esc(s.install.dir)+"</div>"+
  '<div class="r-step">'+t("stepAi")+'</div><div class="r-note">'+t("aiNote")+"</div>"+
  '<div class="r-step">'+t("stepTrust")+'</div><div class="r-note">⚠️ '+t("trustNote")+"</div>"+
  '<div class="r-actions"><a class="r-btn" target="_blank" rel="noopener" href="'+esc(s.url)+'">'+t("viewSrc")+' ↗</a><button class="r-btn solid" id="copyAll">'+t("copyAll")+"</button></div>"+
  '<div class="barcode" aria-hidden="true"></div><div style="text-align:center;font-size:10px;color:#8a8878">'+stamp+" UTC · ⭐"+fmtStars(s.stars)+'</div><div class="r-thanks">'+t("thanks")+"</div>";
 document.getElementById("veil").classList.add("show");
 document.body.style.overflow="hidden";
 r.querySelector(".r-close").onclick=closeReceipt;
 r.querySelectorAll(".copy").forEach(function(b){b.onclick=function(){copy(b.dataset.c,b)}});
 r.querySelector("#copyAll").onclick=function(){copy(cmds.join(" && \\\n"),this)};
}
function closeReceipt(){document.getElementById("veil").classList.remove("show");document.body.style.overflow=""}
function copy(text,btn){
 var done=function(){var o=btn.textContent;btn.textContent=t("copied");btn.classList.add("ok");setTimeout(function(){btn.textContent=o;btn.classList.remove("ok")},1200)};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,function(){fallbackCopy(text);done()})}
 else{fallbackCopy(text);done()}
}
function fallbackCopy(text){var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta)}

/* events */
document.getElementById("veil").addEventListener("click",function(e){if(e.target===this)closeReceipt()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeReceipt()});
document.getElementById("app").addEventListener("click",function(e){
 var c=e.target.closest(".card");if(!c)return;
 var s=state.data.skills.find(function(x){return x.id===c.dataset.id});if(s)openReceipt(s);
});
document.getElementById("q").addEventListener("input",function(){state.q=this.value.trim();render()});
document.getElementById("langBtn").onclick=function(){
 state.lang=state.lang==="zh"?"en":"zh";
 var u=new URL(location.href);u.searchParams.set("lang",state.lang);history.replaceState(null,"",u);
 render();
};

/* boot */
fetch(FEED).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
 state.data=d;render();
 // JSON-LD ItemList for search & answer engines
 try{
  var ld={"@context":"https://schema.org","@type":"ItemList","name":"Skill 商店 inventory","numberOfItems":d.count,
   "itemListElement":d.skills.slice(0,30).map(function(s,i){return{"@type":"ListItem","position":i+1,"item":{"@type":"SoftwareApplication","name":s.name,"alternateName":s.title_zh||undefined,"description":s.tagline_en||s.desc_en,"applicationCategory":"DeveloperApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"url":s.url}}})};
  var sc=document.createElement("script");sc.type="application/ld+json";sc.textContent=JSON.stringify(ld);document.head.appendChild(sc);
 }catch(e){}
}).catch(function(e){
 document.getElementById("app").innerHTML='<div class="empty"><div class="big">🏪 …</div><div>feed.json '+esc(String(e))+'<br>The shop opens once the first scout run lands.</div></div>';
});
})();
</script>
</body>
</html>
