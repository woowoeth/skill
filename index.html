<title>Skill 商店 — 每天上新的好玩 Agent Skill | Skill Store</title>







<style>
:root{--fg:#111;--muted:#666;--faint:#999;--line:#e5e5e5;--bg:#fff;--soft:#f6f6f6}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:baseline;gap:20px;padding-top:22px;padding-bottom:22px}
.hd h1{font-size:18px;font-weight:650;margin:0;letter-spacing:.2px}
.hd .sub{color:var(--muted);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd nav{display:flex;gap:14px;font-size:14px}
.hd nav a,.hd nav button{color:var(--muted);text-decoration:none;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.hd nav a:hover,.hd nav button:hover{color:var(--fg)}
.status{color:var(--faint);font-size:13.5px;padding:10px 0 2px}
.toolbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5;padding:12px 0}
.toolbar input{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;outline:none;background:var(--bg)}
.toolbar input:focus{border-color:var(--faint)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:13.5px;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;color:var(--muted);font-family:inherit}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--fg);border-color:var(--fg);color:#fff}
.chip small{opacity:.6;margin-left:3px}
section{margin:26px 0}
section h2{font-size:16px;font-weight:650;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
section h2 small{color:var(--faint);font-weight:400;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);cursor:pointer;transition:border-color .12s}
.card:hover{border-color:var(--faint)}
.cover{aspect-ratio:2/1;background:var(--soft);display:block;width:100%}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cbody{padding:12px 14px 13px}
.cbody h3{margin:0 0 4px;font-size:16px;font-weight:600;line-height:1.4}
.cbody h3 span{color:var(--faint);font-weight:400;font-size:13px;margin-left:6px}
.tag{margin:0;color:#3d3d3d;font-size:14px;line-height:1.6;min-height:3.2em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rev{margin:7px 0 0;color:var(--muted);font-size:13.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rev b{font-weight:600;color:#555}
.meta{margin-top:10px;display:flex;justify-content:space-between;gap:10px;color:var(--faint);font-size:12.5px}
.meta .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;align-self:center}
.empty{color:var(--faint);padding:40px 0;text-align:center;font-size:15px}
footer{border-top:1px solid var(--line);margin-top:40px;padding:18px 0 40px;color:var(--faint);font-size:13.5px}
footer a{color:var(--muted);text-decoration:none;margin-right:14px}
footer a:hover{color:var(--fg)}
/* modal */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20;overflow-y:auto;padding:40px 16px}
.veil.open{display:block}
.panel{max-width:620px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:22px 24px 24px;position:relative}
.panel .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:20px;color:var(--faint);cursor:pointer;line-height:1;padding:6px}
.panel .x:hover{color:var(--fg)}
.panel h3{margin:0 0 2px;font-size:19px}
.panel .repo{font-size:13.5px;color:var(--muted)}
.panel .repo a{color:var(--muted)}
.panel p{color:#333;font-size:14.5px}
.panel .en{color:var(--muted)}
.panel .why{color:var(--muted);border-left:2px solid var(--line);padding-left:10px;font-size:14px}
.panel h4{font-size:14.5px;margin:20px 0 8px}
.step{font-size:13.5px;color:var(--muted);margin:12px 0 6px}
.cmd{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px 66px 10px 12px;font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;margin:6px 0}
.cmd button{position:absolute;top:6px;right:6px;font-size:11.5px;padding:3px 9px;border:1px solid var(--line);background:var(--bg);border-radius:5px;cursor:pointer;color:var(--muted);font-family:inherit}
.cmd button:hover{color:var(--fg);border-color:var(--faint)}
.safety{font-size:13.5px;color:var(--muted);margin-top:16px}
@media (max-width:640px){.hd{flex-wrap:wrap;gap:8px 16px;padding-top:18px;padding-bottom:18px}.hd .sub{order:3;flex-basis:100%;white-space:normal;margin-top:2px}}
</style>

<script>
(function(){
"use strict";
var I18N={
 zh:{sub:"每天上新的好玩 Agent Skill 精选",items:"件",updated:"更新于",picks:"推荐",latest:"最新",fresh:"今日上新",all:"全部",search:"搜索 skill、仓库、关键词…",collection:"合集",results:"结果",empty:"没有匹配的结果",install:"安装",step1:"Claude Code（终端）",step2:"claude.ai 网页版：设置 → Capabilities → Skills → 上传技能文件夹（zip）",safety:"提示：Skill 会在你的环境中执行指令，安装前请先阅读 SKILL.md，只装你信得过的。",copy:"复制",copied:"已复制",why:"点评",gh:"在 GitHub 查看",title:"Skill 商店 — 每天上新的好玩 Agent Skill | Skill Store",btn:"EN"},
 en:{sub:"fun agent skills, updated daily",items:"items",updated:"updated",picks:"Picks",latest:"Latest",fresh:"New today",all:"All",search:"Search skills, repos, keywords…",collection:"pack",results:"Results",empty:"No matches",install:"Install",step1:"Claude Code (terminal)",step2:"claude.ai: Settings → Capabilities → Skills → upload the skill folder (zip)",safety:"Note: skills execute instructions in your environment. Read the SKILL.md before installing.",copy:"copy",copied:"copied",why:"Why",gh:"View on GitHub",title:"Skill Store — fun agent skills, updated daily",btn:"中"}
};
var params=new URLSearchParams(location.search);
var lang=params.get("lang")==="en"?"en":"zh";
var t=function(k){return I18N[lang][k]||k};
var D=null, state={q:"",cat:"all"};
var CAT={creative:["#fdf0e7","#b45309"],fun:["#f3edfd","#7c3aed"],writing:["#e8f3ec","#15803d"],life:["#e6f7f5","#0f766e"],docs:["#eef2f6","#526071"],work:["#fdecec","#b0403c"],dev:["#e9f0fb","#2b5cd9"],meta:["#f6ebf8","#a03bb5"]};
function catCol(id){return CAT[id]||["#f2f2f2","#555"]}

function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){n=n||0;return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,"")+"k":String(n)}
function today(){return (D&&D.generated_at?D.generated_at:"").slice(0,10)}
function name(it){return lang==="zh"?(it.title_zh||it.name):it.name}
function tag(it){var s=lang==="zh"?(it.tagline_zh||it.tagline_en):(it.tagline_en||it.desc_en);return s||""}
function catName(id){var c=(D.categories||[]).find(function(x){return x.id===id});return c?(lang==="zh"?c.zh:c.en):id}
function cover(it){return it.cover||og(it)}
function og(it){return "https://opengraph.githubassets.com/1/"+it.repo}

function chrome(){
  document.documentElement.lang=lang==="zh"?"zh-CN":"en";
  document.title=t("title");
  el("sub").textContent=t("sub");
  el("langBtn").textContent=t("btn");
  el("q").placeholder=t("search");
  var s="<span>"+D.count+" "+t("items")+"</span>";
  if(D.new_today&&D.new_today<D.count)s+=" · <span>"+t("fresh")+" "+D.new_today+"</span>";
  s+=" · <span>"+t("updated")+" "+esc((D.generated_at||"").slice(0,10))+"</span>";
  el("status").innerHTML=s;
  var chips='<button class="chip'+(state.cat==="all"?" on":"")+'" data-cat="all">'+t("all")+"<small>"+D.count+"</small></button>";
  (D.categories||[]).forEach(function(c){
    if(!c.count)return;
    var col=catCol(c.id), on=state.cat===c.id;
    var st=on?("background:"+col[1]+";color:#fff;border-color:"+col[1]):("background:"+col[0]+";color:"+col[1]+";border-color:transparent");
    chips+='<button class="chip'+(on?" on":"")+'" data-cat="'+esc(c.id)+'" style="'+st+'">'+esc((c.emoji?c.emoji+" ":"")+(lang==="zh"?c.zh:c.en))+"<small>"+c.count+"</small></button>";
  });
  el("chips").innerHTML=chips;
}

function card(it){
  var extra=it.kind==="collection"?(lang==="zh"?"合集 ×"+(it.skill_count||"?"):"pack ×"+(it.skill_count||"?")):"";
  return '<article class="card" data-id="'+esc(it.id)+'">'
    +'<div class="cover"><img loading="lazy" alt="" src="'+esc(cover(it))+'" data-og="'+esc(og(it))+'" onerror="if(this.dataset.f||this.src===this.dataset.og){this.parentNode.removeChild(this)}else{this.dataset.f=1;this.src=this.dataset.og}"></div>'
    +'<div class="cbody"><h3>'+esc(name(it))+(lang==="zh"&&it.title_zh?"<span>"+esc(it.name)+"</span>":"")+"</h3>"
    +'<p class="tag">'+esc(tag(it))+"</p>"
    +(function(){var w=lang==="zh"?it.why_zh:it.why_en;return w?('<p class="rev"><b>'+t("why")+"</b> · "+esc(w)+"</p>"):""})()
    +'<div class="meta"><div class="l">★ '+fmt(it.stars)+" · "+esc(it.repo)+(extra?" · "+esc(extra):"")+'</div><span class="cat" style="background:'+catCol(it.category)[0]+';color:'+catCol(it.category)[1]+'">'+esc(catName(it.category))+"</span></div>"
    +"</div></article>";
}
function grid(list){return '<div class="grid">'+list.map(card).join("")+"</div>"}

function render(){
  chrome();
  var all=D.skills||[];
  var q=state.q.trim().toLowerCase();
  var list=all.filter(function(it){
    if(state.cat!=="all"&&it.category!==state.cat)return false;
    if(!q)return true;
    return [it.name,it.title_zh,it.tagline_zh,it.tagline_en,it.desc_en,it.repo].join(" ").toLowerCase().indexOf(q)>=0;
  });
  var h="";
  if(!list.length){
    el("main").innerHTML='<div class="empty">'+t("empty")+"</div>";return;
  }
  if(q){                                    // 文字搜索 → 结果
    h='<section><h2>'+t("results")+"<small>"+list.length+"</small></h2>"+grid(list)+"</section>";
  }else if(state.cat!=="all"){              // 频道页 → 频道名做标题
    var c=(D.categories||[]).find(function(x){return x.id===state.cat});
    var name=c?((c.emoji?c.emoji+" ":"")+(lang==="zh"?c.zh:c.en)):state.cat;
    h='<section><h2>'+esc(name)+"<small>"+list.length+"</small></h2>"+grid(list)+"</section>";
  }else{                                    // 首页 → 推荐 + 信息流（新→旧）
    var picks=list.filter(function(x){return x.pick});
    if(picks.length)h+='<section><h2>'+t("picks")+"<small>"+picks.length+"</small></h2>"+grid(picks)+"</section>";
    h+='<section><h2>'+t("latest")+"<small>"+list.length+"</small></h2>"+grid(list)+"</section>";
  }
  el("main").innerHTML=h;
}

function copyText(txt,btn){
  function done(){var o=btn.textContent;btn.textContent=t("copied");setTimeout(function(){btn.textContent=o},1200)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallback()})}else fallback();
  function fallback(){var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)}
}

function openModal(it){
  var ins=it.install||{};
  var h='<button class="x" aria-label="close">×</button>'
    +"<h3>"+esc(name(it))+"</h3>"
    +'<div class="repo"><a href="'+esc(it.url||("https://github.com/"+it.repo))+'" target="_blank" rel="noopener">'+esc(it.repo)+(it.path?" / "+esc(it.path):"")+"</a> · ★ "+fmt(it.stars)+' &nbsp;<span class="cat" style="background:'+catCol(it.category)[0]+';color:'+catCol(it.category)[1]+'">'+esc(catName(it.category))+"</span></div>";
  if(lang==="zh"&&it.tagline_zh)h+="<p>"+esc(it.tagline_zh)+"</p>";
  if(it.desc_en)h+='<p class="en">'+esc(it.desc_en)+"</p>";
  var why=lang==="zh"?it.why_zh:it.why_en;
  if(why)h+='<p class="why">'+t("why")+" · "+esc(why)+"</p>";
  h+="<h4>"+t("install")+"</h4>";
  if(ins.clone||ins.copy){
    h+='<div class="step">1 · '+t("step1")+"</div>";
    if(ins.clone)h+='<div class="cmd">'+esc(ins.clone)+'<button data-c="'+esc(ins.clone)+'">'+t("copy")+"</button></div>";
    if(ins.copy)h+='<div class="cmd">'+esc(ins.copy)+'<button data-c="'+esc(ins.copy)+'">'+t("copy")+"</button></div>";
  }
  h+='<div class="step">2 · '+t("step2")+"</div>";
  h+='<div class="safety">'+t("safety")+"</div>";
  el("panel").innerHTML=h;
  el("veil").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeModal(){el("veil").classList.remove("open");document.body.style.overflow=""}

function jsonld(){
  try{
    var items=(D.skills||[]).slice(0,30).map(function(it,i){
      return {"@type":"ListItem","position":i+1,"item":{"@type":"SoftwareApplication","name":it.name,"description":it.tagline_en||it.desc_en||"","url":it.url||("https://github.com/"+it.repo),"applicationCategory":"DeveloperApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}};
    });
    var s=document.createElement("script");s.type="application/ld+json";
    s.textContent=JSON.stringify({"@context":"https://schema.org","@type":"ItemList","itemListElement":items});
    document.head.appendChild(s);
  }catch(e){}
}

document.addEventListener("click",function(e){
  var chip=e.target.closest(".chip");
  if(chip){state.cat=chip.getAttribute("data-cat");render();return}
  var cp=e.target.closest(".cmd button");
  if(cp){copyText(cp.getAttribute("data-c"),cp);return}
  if(e.target.closest(".panel .x")){closeModal();return}
  if(e.target===el("veil")){closeModal();return}
  var c=e.target.closest(".card");
  if(c&&D){var it=(D.skills||[]).find(function(x){return x.id===c.getAttribute("data-id")});if(it)openModal(it)}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
el("q").addEventListener("input",function(){state.q=this.value;render()});
el("langBtn").addEventListener("click",function(){
  lang=lang==="zh"?"en":"zh";
  var u=new URL(location.href);
  if(lang==="en")u.searchParams.set("lang","en");else u.searchParams.delete("lang");
  history.replaceState(null,"",u);
  render();
});

fetch("skills/feed.json").then(function(r){return r.json()}).then(function(d){D=d;render();jsonld()})
.catch(function(){el("main").innerHTML='<div class="empty">feed.json load failed</div>'});
})();
