name: suggest
# 人工通道：把仓库地址丢进来，跑完整管线（收录 → 写文案 → 判品味 → 扫红线 → 上架）。
#
# 2026-09-02 建。店主连着三次拿着链接来问「为什么每次都是我发现」——
# 在把发现这件事做好之前，**至少让他的投喂只花一次点击**，
# 而不是每次都要开一轮对话、我再手写十条文案。
#
# 用法：Actions → suggest → Run workflow → 在 repos 里填空格分隔的 owner/repo
on:
  workflow_dispatch:
    inputs:
      repos:
        description: "空格分隔的 owner/repo（或完整 github 链接）"
        required: true
permissions:
  contents: write
concurrency:
  group: skill-store-write
  cancel-in-progress: false
jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 收录 + 写文案 + 判品味
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SAME_DAY_SHELF: "1"
        run: python scouts/skill_scout.py --suggest ${{ github.event.inputs.repos }}
      - name: 上架之后补扫红线，命中的撤下
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python scouts/release_clean.py --max 12 --chunk 3 --timeout 240 || true
          python scouts/scout_lib.py || true
      - name: 提交
        if: always()
        run: |
          git config user.name "skill-store-bot"
          git config user.email "skill-store-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "没有变化"; exit 0; }
          git commit -m "suggest: 人工通道收录"
          for i in $(seq 1 6); do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $(( (RANDOM % 5) + 2 ))
          done
          exit 1
