name: daily-restock
on:
  schedule:
    # 一天三班（北京时间约 09 / 14 / 21 点）。GitHub 定时会漂，故每班配一个补跑档。
    - cron: "17 1 * * *"     # ~09:17 北京 — 早班（开门前）
    - cron: "47 1 * * *"     #   补跑
    - cron: "17 6 * * *"     # ~14:17 北京 — 午班
    - cron: "47 6 * * *"     #   补跑
    - cron: "17 13 * * *"    # ~21:17 北京 — 晚班
    - cron: "47 13 * * *"    #   补跑
  workflow_dispatch:
    inputs:
      max_new_repos:
        description: "Max new repos to ingest this run"
        default: "5"
permissions:
  contents: write
concurrency:
  group: skill-store-write
  cancel-in-progress: false
jobs:
  restock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the scout (进货)
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_NEW_REPOS: ${{ github.event.inputs.max_new_repos || '5' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scouts/skill_scout.py
      - name: Commit (conflict-safe; feed regenerated from merged set)
        run: |
          git config user.name "skill-store-bot"
          git config user.email "skill-store-bot@users.noreply.github.com"
          # 1) commit ONLY per-item files + sources — unique names never conflict on rebase
          git add skills/*.json scouts/sources.json
          git reset -q -- skills/feed.json 2>/dev/null || true
          git checkout -q -- skills/feed.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no new stock"; else
            git commit -m "restock: daily scout"
            ok=0
            for i in $(seq 1 8); do
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              echo "push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
            done
            [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
          fi
          # 2) rebuild feed.json from the fully merged set, push with reset+regen retry
          python scouts/scout_lib.py
          git add skills/feed.json
          if git diff --cached --quiet; then echo "feed unchanged"; exit 0; fi
          git commit -m "restock: rebuild feed"
          for i in $(seq 1 8); do
            if git push; then echo "feed pushed"; exit 0; fi
            git fetch origin main && git reset -q --hard origin/main
            python scouts/scout_lib.py
            git add skills/feed.json
            git diff --cached --quiet || git commit -m "restock: rebuild feed"
            echo "feed push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "feed push failed"; exit 1

