name: daily-restock
on:
  schedule:
    # 北京时间 09 / 14 / 21。GitHub cron 是 UTC，会漂几分钟。
    - cron: "17 1 * * *"     # ~09:17 北京
    - cron: "17 6 * * *"     # ~14:17 北京
    - cron: "17 13 * * *"    # ~21:17 北京
  workflow_dispatch:
    inputs:
      max_new_repos:
        description: "Max new repos to ingest this run"
        default: "5"
permissions:
  contents: write
concurrency:
  group: skill-store-write
  cancel-in-progress: false
jobs:
  restock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the scout (进货)
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_NEW_REPOS: ${{ github.event.inputs.max_new_repos || '5' }}
          # 同轮上架。2026-08-31 打开 —— 当天上午我按 docs/CURATION.md:162
          # 「自动进货不直接上架」把它关了，结果自动更新在结构上不可能发生。
          # 那条规则写下来时的两个前提今天都变了：
          #   ① 闸是废物（旧闸放行 33% 的心选和 32% 的其它，+1pt）
          #      → 现在是「四句齐 + 真局限≥20 字」，心选 99% / 库房 54%
          #   ② 文案是一句伪造的常量（_local_copy 里那句"产物会串味"）
          #      → 已删，写不出文案就留库房
          # 老实说清楚它弱在哪：文案现在由 enrich(LLM) 写，所以这道闸**不再证明
          # 「有人读过」**，只证明「有一句具体的局限」。第二道防线是
          # check_curation 的【14】机器占位文案上架。
          # 2026-09-02 关掉。打开它的那一轮上架 12 件，**12 件全都没有红线扫描存档** ——
          # same_day_shelf 只看文案，扫描相关的引用是 0 处，它根本不扫就上架。
          # 而下面那步 release_clean 是「同一套文案门禁 + 先扫红线、零命中才放行」，
          # 严格更强，却排在它后面 —— 等于我这条弱路把货先放过去了。
          # **一条路，一套标准，含扫描。** 上架统一交给 release_clean。
          SAME_DAY_SHELF: "0"
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          # tee the scout's own stdout: 拒收榜的统计数字要可追溯，日志就是凭据。
          set -o pipefail
          python scouts/skill_scout.py 2>&1 | tee "${RUNNER_TEMP}/scout-run.log"
      # 进货能进、文案写不出来 —— 这条从 2026-08-18 断到 08-31，13 天，
      # 每天 success。因为 enrich 拿不到 key 只打印一行 skipped，跑批照样退 0。
      # 期间进货一直在进（08-31 那次 195 个候选、19 件新货），全部「缺文案留库房」，
      # 上架 0 件。库房积到 720 件才被店主问「为什么不更新」。
      #
      # 灯必须红。但不能让跑批本身失败 —— 那样连进货都提交不了，
      # 白跑一趟还丢货。所以放在提交之后单独一步：货照进、照提交，然后把灯点红。
      # 自动放行：扫红线，干净的当轮上架。
      # 2026-09-01 加。此前「自动进货 + 自动写文案 + 手动放行」——中间那道手动，
      # 让整条链名义自动、实际停摆：19 件文案全写好了，货架一件没多，
      # 直到店主问「几天没更新」才有人去手动跑扫描。
      #
      # 边界（守住 scan_refs.py「不下判决、不自动拒收」的原则）：
      #   · 扫完没有任何命中 → 自动放行（没东西可判断）
      #   · 扫出命中         → 留库房等人读原文（哪怕看着像误报）
      #   · 扫不动/超时      → 留库房，不当作干净
      # 宁可漏放不可错放：好货晚一天上架没什么，带毒的上架了要人命。
      - name: 扫红线，干净的自动上架
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scouts/release_clean.py --max 12 --chunk 3 --timeout 240 || true
          python scouts/scout_lib.py || true

      - name: 有新货却没人写文案 —— 灯要红
        if: always()
        run: |
          L="${RUNNER_TEMP}/scout-run.log"
          [ -f "$L" ] || exit 0
          # 两种「有新货但一件也写不出文案」都要点红：
          #   ① enrich: skipped (N new items, LLM_API_KEY not set)   —— key 没配
          #   ② enrich: 0/N items copywritten by ...                 —— key 配了但调用全失败
          # 2026-08-31 只写了①，结果那轮 21 件全 401、上架 0 件，**灯还是绿的**。
          # 「跑了」和「跑出东西了」是两回事，闸要认后者。
          line=$(grep -oE "enrich: skipped \([0-9]+ new items[^)]*\)" "$L" | head -1)
          n=$(printf '%s' "$line" | grep -oE '[0-9]+' | head -1)
          if [ -z "$line" ]; then
            line=$(grep -oE "enrich: 0/[0-9]+ items copywritten" "$L" | head -1)
            n=$(printf '%s' "$line" | grep -oE '[0-9]+' | sed -n 2p)
            if [ -n "$line" ]; then
              echo "::error::$line —— enrich 跑了但一件都没成。上面几行有每件的原因（多半是 401/超时）。"
              # 必须限定在 enrich 行里再抓：日志更早处有抓仓时的 HTTP Error 404，
              # 不限定就会把那条当成 enrich 的失败原因报出来 —— **误导比不报更糟**。
              grep "enrich" "$L" | grep -oE "HTTP Error [0-9]+" | head -1 \
                | xargs -I{} echo "::error::enrich 第一条失败：{}"
              grep -oE "端点 [^ ]+ · 模型 [^ ]+" "$L" | head -1 | xargs -I{} echo "::error::用的是 {}"
            fi
          fi
          [ -n "$line" ] || exit 0
          [ "${n:-0}" -gt 0 ] || exit 0
          echo "::error::$line —— 进了 $n 件新货，一件也写不出文案，所以一件也上不了架。"
          echo "::error::修法：gh secret set LLM_API_KEY -R woowoeth/skill（还有 LLM_BASE_URL / LLM_MODEL）"
          grep -c "缺文案留库房" "$L" | xargs -I{} echo "::error::本次留库房 {} 件"
          exit 1

      # 货架体检：按**访客所见**查（图挂没挂、今天有没有上新、卡片缺不缺句）。
      # 上面那个 Editorial check 查的是数据自不自洽，查不出这些。
      # 2026-09-02 加 —— 之前这三类问题全是店主先看见、我后去修，
      # 等于把体检外包给了店主。**坏的要自己红，不该等人报。**
      - name: 货架体检（访客视角）
        if: always()
        run: python scouts/shelf_health.py --sample 30

      - name: Editorial check (报告，不拦车)
        continue-on-error: true
        run: python scouts/check_curation.py
      - name: Commit (conflict-safe; feed regenerated from merged set)
        run: |
          git config user.name "skill-store-bot"
          git config user.email "skill-store-bot@users.noreply.github.com"
          # 1) commit ONLY per-item files + sources — unique names never conflict on rebase
          #    聚合产物（feed.json / rejected-feed.json）永远在第 2 步从合并后的全量重建
          git add skills/*.json scouts/sources.json editorial/curation.json
          for agg in skills/feed.json skills/rejected-feed.json; do
            git reset -q -- "$agg" 2>/dev/null || true
            git checkout -q -- "$agg" 2>/dev/null || true
          done
          if git diff --cached --quiet; then echo "no new stock"; else
            git commit -m "restock: daily scout"
            ok=0
            for i in $(seq 1 8); do
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              echo "push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
            done
            [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
          fi
          # 2) rebuild the aggregates from the fully merged set, push with reset+regen retry
          #    --from-log 把这一轮扫描的真实数字记进 scouts/scan_log.json（拒收榜的统计来源）
          python scouts/scout_lib.py --from-log "${RUNNER_TEMP}/scout-run.log"
          git add -- skills/feed.json skills/rejected-feed.json scouts/scan_log.json i sitemap.xml llms.txt llms-full.txt feed.xml robots.txt index.html assets/covers editorial/curation.json 2>/dev/null || git add -- skills/feed.json skills/rejected-feed.json
          if git diff --cached --quiet; then echo "feed unchanged"; exit 0; fi
          git commit -m "restock: rebuild feed and index"
          for i in $(seq 1 8); do
            if git push; then echo "feed pushed"; exit 0; fi
            git fetch origin main && git reset -q --hard origin/main
            # reset --hard 把刚才那次记录一起丢了，所以重试要重记一次 —— 不会重复计数
            python scouts/scout_lib.py --from-log "${RUNNER_TEMP}/scout-run.log"
            git add -- skills/feed.json skills/rejected-feed.json scouts/scan_log.json i sitemap.xml llms.txt llms-full.txt feed.xml robots.txt index.html assets/covers editorial/curation.json 2>/dev/null || git add -- skills/feed.json skills/rejected-feed.json
            git diff --cached --quiet || git commit -m "restock: rebuild feed and index"
            echo "feed push retry $i"; sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "feed push failed"; exit 1

