name: sweep
# 自己去找有品味的货 —— 发现 → 判品味 → 值得的交给完整管线。
#
# 2026-09-02 店主：「你要去不断迭代自己，不要每次让我告诉你哪些漏掉了，
# 你要自己有能力发现漏掉的有品味的 skill」。
#
# 在这之前两半是断的：discover_by_artifact 已经翻出 1276 个没进过库的仓，
# 品味判据也回测到 +61pt —— **但从来没拿判据去扫过那个候选池**。
# 有渔网也有秤，却在等店主把鱼递过来。这条工作流就是那根接线。
on:
  schedule:
    # 一班一片。CI 的 GITHUB_TOKEN 做代码搜索被限得很狠（实测 try again in 733s），
    # 一轮跑五片必被打断；拆成五班，每班 ≤10 次请求。片由 cron 分钟位决定（见下一步）。
    - cron: "40 2 * * *"
    - cron: "40 5 * * *"
    - cron: "40 8 * * *"
    - cron: "40 11 * * *"
    - cron: "40 14 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "本轮判多少个候选"
        default: "400"
      slice:
        description: "只跑哪一片（空=按时刻自动选）"
        default: ""
permissions:
  contents: write
# 2026-09-03 拆成两个 job：
#   find_and_judge —— 发现 + 判品味，不写仓，**不占写锁**，最多跑 150 分钟；
#   publish        —— 走管线、补扫、提交，占 skill-store-write 锁，几分钟就完。
# 之前整条工作流占锁，判 800 个候选 × 3 票要一两个小时，restock 和 enrich-backfill 全排在后面；
# 而 GitHub 同一个锁组只留一个 pending —— 新来的把老的 pending 踢掉。改标题那趟就是这样等了一小时。
# 「确保每日更新」的前提是进货不能被判官堵住。
jobs:
  find_and_judge:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # 自动上架线取 80，不取 70 —— 2026-09-02 第一轮跑完立刻发现的：
      # 判官给上架的 5 件，**每一条理由里都写着「但本质是流程编排／安装配置／脚本封装」**，
      # 那正是 08-28 砍架要清掉的 useful-but-generic 那一类。
      # 而我自己写的评分档明写着「60-79 做得扎实，但换个工具也能做」——
      # **我把自己定义为「可替代」的那一档放进了货架。**
      # 抬到 80（这轮 31 个有效分里只有 2 个）。
      #
      # 代价说清楚：店主指名的 OJO 和 goldie 都是 72 分，抬到 80 它们也会被挡。
      # 也就是说**这个判官分不开「OJO 的含糊词防火墙」和「一份配置指南」**——
      # 顶部 31 个分里 10 个挤在 72。根因是我的验证集：+61pt 是拿
      # 「按问一/问二/问三拒收的」当负样本测的，那些是烂货，不是「扎实但通用」的货，
      # **我从来没拿真正的难负样本验过它**。下一步是补那批负样本重训判官，
      # 不是继续调分数线。
      # 先自查：店主指名过的那些，现在这套能不能自己判出来。
      # **失败不阻断后面** —— 它是尺子不是闸；但结果要留在日志里，
      # 因为「这套还差多少」比「这轮捞到几个」更值得看。
      - name: 自查 —— 店主指名的那些，现在能自己判到吗
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scouts/sweep.py --audit

      # 流式全扫：GitHub 上新索引的 SKILL.md **全部**过一遍，按路径切五片各翻满 1000，
      # 每片读到碰上上一轮的边为止。翻满还碰不到 = 断口 = 这一步红。
      # 2026-09-02 量的：一天新出的 SKILL.md 超过 1000 个文件，之前每轮翻 1 页
      # 是在一条河里舀一勺 —— 店主：「不然无论如何你都会错过一些优质的 skill」。
      - name: 流式全扫（一班一片）
        id: stream
        env:
          GH_TOKEN: ${{ github.token }}
          SLICE_IN: ${{ github.event.inputs.slice }}
        run: |
          # 手动给了片就用；没给按 UTC 小时选：2→skills 5→claude 8→agents 11→plugins 14→rest
          S="$SLICE_IN"
          if [ -z "$S" ]; then
            case "$(date -u +%H)" in 02) S=skills;; 05) S=claude;; 08) S=agents;; 11) S=plugins;; 14) S=rest;; *) S=skills;; esac
          fi
          echo "本班跑片：$S"
          python scouts/stream.py --slice "$S" --out /tmp/stream_new.json

      # 老的四条通道保留：topic / awesome 能捞到没有 SKILL.md 但值得看的仓
      - name: 补充通道（topic / awesome）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scouts/discover_by_artifact.py --pages 1 --out /tmp/artifact_candidates.json || true
          # 存量回填：按创建日回看 3 天（每天一班，五班合起来覆盖过去两周多），只验 ≥3 星的。
          # 流扫只看最新索引，几天前建的仓永远碰不到 —— 实测一天里 40% 的候选有 SKILL.md 且从没见过。
          python scouts/backfill.py --days 3 --out /tmp/backfill_candidates.json || true
          # skillsmp.com（店主 09-03 指的新源）：只有关键词搜索接口、匿名 50 次/天，
          # 按班分片各跑 ≈12 次，五班合计 < 50。产出同样交给判官。
          case "$(date -u +%H)" in 02) SH=0;; 05) SH=1;; 08) SH=2;; 11) SH=3;; 14) SH=4;; *) SH=0;; esac
          python scouts/source_skillsmp.py --shard "$SH" --out /tmp/skillsmp_candidates.json || true
          python3 - <<'PY2'
          import json,os
          a=json.load(open('/tmp/stream_new.json')) if os.path.exists('/tmp/stream_new.json') else {}
          # editorial/backfill_backlog.json：本地一次性回填的 21 天积压清单，跑一轮就消化一批
          for fn in ('/tmp/artifact_candidates.json','/tmp/backfill_candidates.json','/tmp/skillsmp_candidates.json','editorial/backfill_backlog.json'):
              b=json.load(open(fn)) if os.path.exists(fn) else {}
              for k,v in b.items(): a.setdefault(k,v)
          json.dump(a,open('/tmp/candidates.json','w'),ensure_ascii=False,indent=1)
          print(f"合并候选 {len(a)} 个（流 {len(a)-len([k for k in b if k not in a])} + 补充）")
          PY2

      - name: 判品味，挑出值得写文案的
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        # 判**全部**新见的，不再只判 40 个 —— 发现做到全量之后，判只判一角就白扫了。
        # 每天几百个仓 × 三票取中位。sweep.py 第一票离线 15 分以上就不投后两票，省掉大半调用。
        # 这个 job 不占写锁，判多久都不堵进货。
        run: python scouts/sweep.py --candidates /tmp/candidates.json --max ${{ github.event.inputs.max || 400 }} --min-score 80

      - name: 判分结果交给发布 job
        if: always()
        run: |
          mkdir -p /tmp/handoff
          cp /tmp/sweep_keep.json /tmp/handoff/ 2>/dev/null || echo "[]" > /tmp/handoff/sweep_keep.json
          for f in editorial/sweep_seen.json editorial/stream_seen.json editorial/coverage_log.json editorial/backfill_seen.json editorial/skillsmp_seen.json editorial/discover_seen.json; do
            [ -e "$f" ] && cp "$f" /tmp/handoff/ || true
          done
          ls -la /tmp/handoff
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sweep-handoff, path: /tmp/handoff, retention-days: 3 }

  publish:
    needs: find_and_judge
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: skill-store-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: sweep-handoff, path: /tmp/handoff }
      - name: 接过判分结果和各通道的「见过」清单
        run: |
          cp /tmp/handoff/sweep_keep.json /tmp/sweep_keep.json
          for f in sweep_seen stream_seen coverage_log backfill_seen skillsmp_seen discover_seen; do
            [ -e "/tmp/handoff/$f.json" ] && cp "/tmp/handoff/$f.json" "editorial/$f.json" || true
          done
          python3 -c "import json;k=json.load(open('/tmp/sweep_keep.json'));print(f'≥80 分的 {len(k)} 个')"

      # 2026-09-02 暂停：绝对打分在难负样本（08-28 判为「有用但通用」的 150 件）上 +0pt，
      # 正负分布重叠在 62-75，负样本均分（72.4）反而高于正样本（66.6）。
      # 判官分得开好和烂，分不开好和平庸 —— 而这家店的分界线正在好和平庸之间。
      # 在成对比较法验出信号之前，sweep 只判只记，不上架。判过的分都在 sweep_seen.json 里。
      # 2026-09-03 恢复，线 80。两轮回测说清了判官的能力边界：
      #   好 vs 烂（问一二三拒收的）      +61pt   —— 分得开
      #   好 vs 平庸（08-28 砍的那批）    +0pt / 成对 +6pt —— 分不开
      # 但那批「平庸」标签是同事砍架时打的，不是店主打的 —— 店主标过的负样本一件都不存在。
      # 所以现在的判官是「筛掉烂货」的粗筛，不是「挑出品味」的细筛。
      # 80 分以上这轮 31 个里只有 2 个：量小，能进的以店主纠为主。
      # 完全不放 = 货架不动，那违背「每天更新」。放 80 以上 = 少而可纠。取后者。
      - name: 高分的走完整管线（线 80）
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SAME_DAY_SHELF: "1"
          # 2026-09-03 实测：sweep 挑出 ≥80 的**仓**，--suggest 进去后按默认 60 线把仓里
          # **每个子 skill** 又判了一遍，62/65/72/75 分的全上了架 —— 80 线被自己的下游绕过。
          # 这一步的门槛必须和挑选的门槛一致。
          TASTE_MIN: "80"
        run: |
          R=$(python3 -c "import json;print(' '.join(k['repo'] for k in json.load(open('/tmp/sweep_keep.json'))[:25]))" 2>/dev/null || true)
          # 09-03 第一轮积压：22 个 ≥80 只交了前 10 个，剩下 12 个进了 sweep_seen「已判」再也不会被交 —— 放宽到 25。
          [ -n "$R" ] || { echo "本轮没有 ≥80 分的"; exit 0; }
          echo "交给管线：$R"
          python scouts/skill_scout.py --suggest $R

      - name: 上架之后补扫红线，命中的撤下
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python scouts/release_clean.py --max 12 --chunk 3 --timeout 240 || true
          python scouts/scout_lib.py || true

      - name: 提交
        if: always()
        run: |
          bash scouts/git_sync.sh "sweep: 自动发现并判品味"
