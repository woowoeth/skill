name: sweep
# 自己去找有品味的货 —— 发现 → 判品味 → 值得的交给完整管线。
#
# 2026-09-02 店主：「你要去不断迭代自己，不要每次让我告诉你哪些漏掉了，
# 你要自己有能力发现漏掉的有品味的 skill」。
#
# 在这之前两半是断的：discover_by_artifact 已经翻出 1276 个没进过库的仓，
# 品味判据也回测到 +61pt —— **但从来没拿判据去扫过那个候选池**。
# 有渔网也有秤，却在等店主把鱼递过来。这条工作流就是那根接线。
on:
  schedule:
    # 一班一片。CI 的 GITHUB_TOKEN 做代码搜索被限得很狠（实测 try again in 733s），
    # 一轮跑五片必被打断；拆成五班，每班 ≤10 次请求。片由 cron 分钟位决定（见下一步）。
    - cron: "40 2 * * *"
    - cron: "40 5 * * *"
    - cron: "40 8 * * *"
    - cron: "40 11 * * *"
    - cron: "40 14 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "本轮判多少个候选"
        default: "800"
      slice:
        description: "只跑哪一片（空=按时刻自动选）"
        default: ""
permissions:
  contents: write
concurrency:
  group: skill-store-write
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # 自动上架线取 80，不取 70 —— 2026-09-02 第一轮跑完立刻发现的：
      # 判官给上架的 5 件，**每一条理由里都写着「但本质是流程编排／安装配置／脚本封装」**，
      # 那正是 08-28 砍架要清掉的 useful-but-generic 那一类。
      # 而我自己写的评分档明写着「60-79 做得扎实，但换个工具也能做」——
      # **我把自己定义为「可替代」的那一档放进了货架。**
      # 抬到 80（这轮 31 个有效分里只有 2 个）。
      #
      # 代价说清楚：店主指名的 OJO 和 goldie 都是 72 分，抬到 80 它们也会被挡。
      # 也就是说**这个判官分不开「OJO 的含糊词防火墙」和「一份配置指南」**——
      # 顶部 31 个分里 10 个挤在 72。根因是我的验证集：+61pt 是拿
      # 「按问一/问二/问三拒收的」当负样本测的，那些是烂货，不是「扎实但通用」的货，
      # **我从来没拿真正的难负样本验过它**。下一步是补那批负样本重训判官，
      # 不是继续调分数线。
      # 先自查：店主指名过的那些，现在这套能不能自己判出来。
      # **失败不阻断后面** —— 它是尺子不是闸；但结果要留在日志里，
      # 因为「这套还差多少」比「这轮捞到几个」更值得看。
      - name: 自查 —— 店主指名的那些，现在能自己判到吗
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scouts/sweep.py --audit

      # 流式全扫：GitHub 上新索引的 SKILL.md **全部**过一遍，按路径切五片各翻满 1000，
      # 每片读到碰上上一轮的边为止。翻满还碰不到 = 断口 = 这一步红。
      # 2026-09-02 量的：一天新出的 SKILL.md 超过 1000 个文件，之前每轮翻 1 页
      # 是在一条河里舀一勺 —— 店主：「不然无论如何你都会错过一些优质的 skill」。
      - name: 流式全扫（一班一片）
        id: stream
        env:
          GH_TOKEN: ${{ github.token }}
          SLICE_IN: ${{ github.event.inputs.slice }}
        run: |
          # 手动给了片就用；没给按 UTC 小时选：2→skills 5→claude 8→agents 11→plugins 14→rest
          S="$SLICE_IN"
          if [ -z "$S" ]; then
            case "$(date -u +%H)" in 02) S=skills;; 05) S=claude;; 08) S=agents;; 11) S=plugins;; 14) S=rest;; *) S=skills;; esac
          fi
          echo "本班跑片：$S"
          python scouts/stream.py --slice "$S" --out /tmp/stream_new.json

      # 老的四条通道保留：topic / awesome 能捞到没有 SKILL.md 但值得看的仓
      - name: 补充通道（topic / awesome）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scouts/discover_by_artifact.py --pages 1 --out /tmp/artifact_candidates.json || true
          python3 - <<'PY2'
          import json,os
          a=json.load(open('/tmp/stream_new.json')) if os.path.exists('/tmp/stream_new.json') else {}
          b=json.load(open('/tmp/artifact_candidates.json')) if os.path.exists('/tmp/artifact_candidates.json') else {}
          for k,v in b.items(): a.setdefault(k,v)
          json.dump(a,open('/tmp/candidates.json','w'),ensure_ascii=False,indent=1)
          print(f"合并候选 {len(a)} 个（流 {len(a)-len([k for k in b if k not in a])} + 补充）")
          PY2

      - name: 判品味，挑出值得写文案的
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        # 判**全部**新见的，不再只判 40 个 —— 发现做到全量之后，判只判一角就白扫了。
        # 每天几百个仓 × 一次 LLM 调用，钱是小数；时间上限 6 小时够。
        run: python scouts/sweep.py --candidates /tmp/candidates.json --max ${{ github.event.inputs.max || 800 }} --min-score 80

      # 2026-09-02 暂停：绝对打分在难负样本（08-28 判为「有用但通用」的 150 件）上 +0pt，
      # 正负分布重叠在 62-75，负样本均分（72.4）反而高于正样本（66.6）。
      # 判官分得开好和烂，分不开好和平庸 —— 而这家店的分界线正在好和平庸之间。
      # 在成对比较法验出信号之前，sweep 只判只记，不上架。判过的分都在 sweep_seen.json 里。
      # 2026-09-03 恢复，线 80。两轮回测说清了判官的能力边界：
      #   好 vs 烂（问一二三拒收的）      +61pt   —— 分得开
      #   好 vs 平庸（08-28 砍的那批）    +0pt / 成对 +6pt —— 分不开
      # 但那批「平庸」标签是同事砍架时打的，不是店主打的 —— 店主标过的负样本一件都不存在。
      # 所以现在的判官是「筛掉烂货」的粗筛，不是「挑出品味」的细筛。
      # 80 分以上这轮 31 个里只有 2 个：量小，能进的以店主纠为主。
      # 完全不放 = 货架不动，那违背「每天更新」。放 80 以上 = 少而可纠。取后者。
      - name: 高分的走完整管线（线 80）
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SAME_DAY_SHELF: "1"
        run: |
          R=$(python3 -c "import json;print(' '.join(k['repo'] for k in json.load(open('/tmp/sweep_keep.json'))[:10]))" 2>/dev/null || true)
          [ -n "$R" ] || { echo "本轮没有 ≥70 分的"; exit 0; }
          echo "交给管线：$R"
          python scouts/skill_scout.py --suggest $R

      - name: 上架之后补扫红线，命中的撤下
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python scouts/release_clean.py --max 12 --chunk 3 --timeout 240 || true
          python scouts/scout_lib.py || true

      - name: 提交
        if: always()
        run: |
          git config user.name "skill-store-bot"
          git config user.email "skill-store-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "没有变化"; exit 0; }
          git commit -m "sweep: 自动发现并判品味"
          for i in $(seq 1 6); do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $(( (RANDOM % 5) + 2 ))
          done
          exit 1
