name: enrich-backfill
on:
  workflow_dispatch:
    inputs:
      retitle_since:
        description: "只重写这个日期起入库的货的标题（留空=补缺的句子）"
        default: ""
      retitle_match:
        description: "重写标题匹配此正则的货（如 ^(只认|只剪|拒绝|把)）"
        default: ""
permissions:
  contents: write
concurrency:
  group: skill-store-write     # 与进货共用写锁，避免并发覆盖
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 补写在架占位货文案
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          if [ -n "${{ github.event.inputs.retitle_since }}" ] || [ -n "${{ github.event.inputs.retitle_match }}" ]; then
            python scouts/skill_scout.py --retitle-since "${{ github.event.inputs.retitle_since }}" --retitle-match "${{ github.event.inputs.retitle_match }}"
          else
            python scouts/skill_scout.py --enrich-missing
          fi
      - name: 提交
        run: |
          bash scouts/git_sync.sh "enrich: 补写在架占位货文案"
