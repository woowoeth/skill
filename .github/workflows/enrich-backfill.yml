name: enrich-backfill
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skill-store-write     # 与进货共用写锁，避免并发覆盖
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 补写在架占位货文案
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scouts/skill_scout.py --enrich-missing
      - name: 提交
        run: bash scouts/git_sync.sh "enrich: 补写在架占位货文案"
