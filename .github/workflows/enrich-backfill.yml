name: enrich-backfill
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skill-store-write     # 与进货共用写锁，避免并发覆盖
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 补写在架占位货文案
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scouts/skill_scout.py --enrich-missing
      - name: 提交
        run: |
          git config user.name "skill-store-bot"
          git config user.email "bot@users.noreply.github.com"
          git add skills/*.json
          git diff --cached --quiet && { echo "无变化"; exit 0; }
          git commit -m "enrich: 补写在架占位货文案"
          for i in $(seq 1 6); do git pull --rebase --autostash origin main && git push && exit 0; sleep 3; done
          echo "push failed"; exit 1
