<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>品味 — 中文 Agent Skill 精選</title>
<meta name="description" content="叫 SKILL.md 的文件已經百萬量級，沒人數得清。我們只挑值得裝的，並且把挑它的理由寫下來。">

<!-- ================================================================
     早啟動：feed.json 是唯一真正必需的數據，在樣式和腳本解析之前就發出去。
     covers.json 是過渡期的封面來源（低優先級），拿不到也不影響任何東西。
     ▸ 版式的一條硬規矩：**首屏不等任何 fetch**。見下面「起飛」一節。
     ================================================================ -->
<script>
window.__FEED__ = fetch("../skills/feed.json").then(function(r){
  if(!r.ok) throw new Error("feed "+r.status); return r.json();
});
window.__COVERS__ = (function(){
  try{
    return fetch("../editorial/covers.json", {priority:"low"})
      .then(function(r){ return r.ok ? r.json() : null })
      .catch(function(){ return null });
  }catch(e){ return Promise.resolve(null) }
})();
</script>

<style>
/* ============================================================
   品味 · 版式原型 v3 「排字間」
   設計立場：這不是貨架，是專欄。單位不是卡片，是判斷。

   v3 相對 v2 改了四件事（都有實測依據，見各處註釋）：
   1 首屏不再等 fetch —— 報頭與立場句是靜態 HTML，貨架後填
   2 拒收榜整塊撤掉 —— 數據是 0 條，展示樣張等於自傷誠實
   3 封面按「真產出物圖」篩，OG 卡不上站；畫幅隨自然比例，不裁切
   4「點評 / 但是」重排 —— 實測「但是」中位 106 字、比「點評」長得多，
     不能再當小字腳註排。層級靠字體和顏色分，不靠縮小。

   配色：紙 + 墨 + 朱。**底色方案仍在等店主拍板，這一版沒有動任何色值。**
   ============================================================ */

:root{
  /* —— 紙 —— 暖白，不是 #fafafa 那種屏幕灰。印刷物的底 —— */
  --paper:      #f6f3ec;
  --paper-2:    #efeade;
  --sheet:      #fffefb;

  /* —— 墨 —— 不用純黑，用帶一點暖的炭黑，長文更耐讀 —— */
  --ink:        #191613;
  --ink-2:      #3b3630;
  --ink-3:      #6d665c;
  --ink-4:      #9a9287;

  /* —— 線 —— */
  --rule:       #ddd6c8;
  --rule-2:     #c6bdaa;
  --rule-ink:   #191613;

  /* —— 朱 —— 唯一的彩色。只給編輯動作用：期號、但是、上新 —— */
  --seal:       #a4342a;
  --seal-2:     #c9564a;
  --seal-wash:  #f0e2dd;

  /* —— 字 —— 零外部依賴，全系統字體 —— */
  --serif: 'Songti SC','Source Han Serif SC','Noto Serif CJK SC','STSong','SimSun',
           'Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:  -apple-system,BlinkMacSystemFont,'PingFang SC','HarmonyOS Sans SC',
           'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:  'SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;

  /* ---- 字號階梯 ----------------------------------------------
     1.28 倍率，九級封頂。中文沒有 x-height 可借，級差小於 1.2 就分不出來，
     所以寧可少幾級、級級看得出差別。 */
  --t-micro: 11px;
  --t-cap:   12.5px;
  --t-meta:  13px;
  --t-body:  15px;
  --t-lead:  17px;
  --t-h3:    19px;
  --t-h2:    27px;
  --t-h1:    38px;
  --t-hero:  56px;

  /* ---- 行高 --------------------------------------------------
     中文方塊字沒有升降部，行距要比西文松：正文 1.85，長文 1.95，標題 1.2–1.4。
     這三個值是全站唯一的行高來源，別在局部另發明。 */
  --lh-tight: 1.22;
  --lh-title: 1.38;
  --lh-body:  1.85;
  --lh-long:  1.95;

  /* —— 留白節奏：4 起步，段落 20，欄目 56，章節 88 —— */
  --s1:4px; --s2:8px; --s3:12px; --s4:20px; --s5:32px; --s6:56px; --s7:88px;

  /* 中文正文單行 34 字左右最耐讀。em 在中文裡就等於「字」，所以這個值直接讀作字數 */
  --measure: 34em;
  --measure-long: 36em;   /* 頭條長判斷專用，最長 800 字也就 24 行 */
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15130f; --paper-2:#1c1915; --sheet:#1a1713;
    --ink:#eee8dc; --ink-2:#c8c1b4; --ink-3:#968f82; --ink-4:#6b655b;
    --rule:#332e26; --rule-2:#4a4338; --rule-ink:#eee8dc;
    --seal:#d9776a; --seal-2:#e08d80; --seal-wash:#2c1e1b;
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:var(--t-body)/var(--lh-body) var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  /* 行末標點懸掛 —— 中文排版裡句號頂到邊線上很難看，能懸就懸。
     Safari 支持，其餘瀏覽器忽略，沒有副作用。 */
  hanging-punctuation: allow-end;
}
/* 中文標點前後的空隙壓縮。支持的瀏覽器（Chrome 123+）會把連續標點擠緊，
   不支持的原樣顯示 —— 屬於「能做到就做，做不到不假裝」。 */
@supports (text-spacing-trim: space-first){
  body{ text-spacing-trim: space-first }
}
a{color:inherit;text-decoration:none}
::selection{background:var(--seal);color:var(--paper)}
:focus-visible{outline:2px solid var(--seal);outline-offset:3px}
img{max-width:100%}

/* ---- 中英混排的那一口氣 --------------------------------------
   「用 GB/T 9704 寫公文」裡 CJK 和拉丁之間該有約四分之一字的空隙，
   瀏覽器不會自己加。JS 在邊界插一個空的 <i class="g">，靠 margin 造縫——
   不插真空格，複製出去還是乾淨的原文。
   這是英文站不會做、也沒必要做的事，正好是我們該做到的地方。 */
i.g{font-style:normal;display:inline;margin:0 .09em}

.wrap{max-width:1140px;margin:0 auto;padding:0 24px}

/* 通用小鉛字標籤：欄目名、字段名 */
.label{
  font:600 var(--t-micro)/1 var(--sans);
  letter-spacing:.22em; text-transform:uppercase;
  color:var(--ink-4);
}
.label.zh{letter-spacing:.36em;text-transform:none}

/* ============ 報頭 ============
   整塊是靜態 HTML，第一次繪製就有內容。只有三個數字要等 feed，
   數字缺的時候整句話照樣讀得通 —— 這就是「不阻塞」在版式上的樣子。 */
header.masthead{padding-top:var(--s5)}
.mast-top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4)}
.logo{display:flex;align-items:baseline;gap:12px;min-width:0}
.logo b{font:400 44px/1 var(--serif);letter-spacing:.1em;color:var(--ink);display:block}
.logo i{
  font:400 var(--t-micro)/1 var(--sans); font-style:normal;
  letter-spacing:.42em; text-transform:uppercase; color:var(--ink-4);
  white-space:nowrap;
}
.mast-right{
  display:flex;align-items:center;gap:var(--s3);
  font:var(--t-cap)/1 var(--mono); color:var(--ink-3); white-space:nowrap;
}
.mast-right .sep{color:var(--rule-2)}
#langBtn{
  font:600 var(--t-micro)/1 var(--sans); letter-spacing:.14em;
  background:none;border:1px solid var(--rule-2);color:var(--ink-3);
  padding:6px 10px;border-radius:2px;cursor:pointer;transition:.15s;
}
#langBtn:hover{border-color:var(--ink);color:var(--ink)}

.mast-rule{margin:var(--s4) 0 0;height:2px;background:var(--rule-ink)}
.mast-rule-thin{height:1px;background:var(--rule-ink);margin-top:2px;opacity:.35}

/* 立場句 —— 全站唯一的「主張」，不是 hero 文案 */
.creed{padding:var(--s5) 0 var(--s5);max-width:44em}
.creed p.say{
  margin:0; font:400 clamp(19px,2.6vw,25px)/1.72 var(--serif);
  color:var(--ink); letter-spacing:.01em;
}
.creed p.say em{font-style:normal;color:var(--seal)}

/* 三個真數。**這一行只放核過的數**：過手 / 上架 / 未上架。
   將來「已寫理由 N 條」就掛在這一行末尾 —— 位置留著，數沒有就不顯示，
   不用 0 去佔位，也不用樣張湊數。 */
.tally{
  margin:var(--s3) 0 0; min-height:1.6em;
  font:var(--t-cap)/1.6 var(--mono); color:var(--ink-3);
  display:flex; flex-wrap:wrap; gap:2px 14px;
}
.tally .k{color:var(--ink-4)}
.tally .sep{color:var(--rule-2)}
.tally b{font-weight:400;color:var(--ink)}

.creed .sub{
  margin-top:var(--s3); font:var(--t-meta)/1.75 var(--sans); color:var(--ink-3);
  max-width:38em;
}
.creed .sub a{border-bottom:1px solid var(--rule-2)}
.creed .sub a:hover{border-color:var(--ink)}

/* ============ 欄目頭 ============ */
.sec-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:var(--s3);padding-bottom:var(--s4);
}
.sec-head .t{display:flex;align-items:baseline;gap:14px;min-width:0}
.sec-head h2{margin:0;font:400 var(--t-h3)/1 var(--serif);letter-spacing:.18em;color:var(--ink)}
.sec-head .note{font:var(--t-cap)/1.5 var(--sans);color:var(--ink-4);text-align:right}

/* ============ 頭條 ============ */
.headline{padding:var(--s6) 0 var(--s6);border-top:1px solid var(--rule)}

/* 左正文 / 右圖版。圖版 sticky —— 長判斷 800 字時，圖不會被拉成一根細條，
   而是釘住陪著正文滾。這是「版式吃得下 800 字」的關鍵一手。 */
.hl-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s6);align-items:start}
.hl-grid.solo{grid-template-columns:minmax(0,1fr);gap:var(--s5)}
.hl-grid.solo>div:first-child{max-width:var(--measure-long)}
.hl-grid.solo .plate{max-width:var(--measure-long)}
.hl-grid.solo .past{border-top:0;padding-top:0;margin-top:0}
.plate-hold{position:sticky;top:var(--s4)}

.hl-kicker{display:flex;align-items:center;gap:10px;margin-bottom:var(--s4)}
.hl-kicker .no{font:400 var(--t-h2)/1 var(--serif);color:var(--seal)}
.hl-kicker .cat{font:var(--t-cap)/1 var(--sans);color:var(--ink-3);letter-spacing:.14em}
.hl-title{
  margin:0 0 var(--s4);
  font:400 clamp(31px,4.6vw,var(--t-hero))/var(--lh-tight) var(--serif);
  letter-spacing:.005em; color:var(--ink);
}
.hl-title a:hover{color:var(--seal)}
.hl-lead{
  margin:0 0 var(--s5); font:400 var(--t-lead)/1.88 var(--sans);
  color:var(--ink-2); max-width:30em;
}

/* ---- 長判斷 ----------------------------------------------------
   story_zh 範圍 120–800 字，是全站唯一的長文位，也是「我們賣判斷」
   最集中的地方。所以它按**正文**排，不按加長版簡介排：
   宋體、1.95 行距、36 字行長、段間 1 字高。 */
.story{max-width:var(--measure-long)}
.story .label{color:var(--seal);display:block;margin-bottom:12px}
.story p{
  margin:0 0 1.05em; font:400 var(--t-lead)/var(--lh-long) var(--serif); color:var(--ink);
}
.story p:last-child{margin-bottom:0}
/* 段間只用一種信號。中文書裡是「縮進 + 不留空行」，屏幕上反過來更清楚：
   留一字高的空行、不縮進。兩樣都上會讓窄欄的左邊緣看起來是破的。 */

.byline{margin:var(--s4) 0 0;font:var(--t-cap)/1.7 var(--sans);color:var(--ink-4);letter-spacing:.06em}
.byline b{font-weight:600;color:var(--ink-3)}

.hl-meta{
  margin-top:var(--s5);padding-top:var(--s3);border-top:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:6px 16px;
  font:var(--t-cap)/1.6 var(--mono);color:var(--ink-3);
}
.hl-meta a{border-bottom:1px solid var(--rule-2)}
.hl-meta a:hover{border-color:var(--ink);color:var(--ink)}
.hl-meta .k{color:var(--ink-4)}

/* ---- 徽章：只有正向檔 --------------------------------------------
   星數已徹底離開前端（見 CURATION 四「加分項，不是門檻」）。
   替代信號兩個，都只在「有」的時候出現，沒有就什麼都不印——
   給極簡 skill 印「備料少」，是把星數的錯誤換個馬甲再犯一次。 */
.badges{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 var(--s4)}
.badge{
  font:600 var(--t-micro)/1 var(--sans);letter-spacing:.1em;
  border:1px solid var(--rule-2);color:var(--ink-3);
  padding:5px 7px;border-radius:2px;white-space:nowrap;
}
.badge.read{border-color:var(--seal);color:var(--seal)}

/* 「中文」標 —— 英文版遇到沒英文文案的商品時掛在簡介前。
   中文創作者的東西在英文目錄站裡搜不到，這正是本店存在的理由，
   所以它是標籤，不是錯誤提示。 */
.zhchip{
  display:inline-block;font:600 var(--t-micro)/1 var(--sans);letter-spacing:.1em;
  color:var(--seal);border:1px solid var(--seal);border-radius:2px;
  padding:3px 5px;margin-right:2px;vertical-align:1px;white-space:nowrap;
}

/* ============ 圖版 ============
   ---- 封面三條硬規矩（實測出來的，不是想出來的）----------------
   1 只上**真產出物圖**。GitHub 自動生成的 OG 卡片一律不上站——
     那就是「把標題又寫一遍」，跟漸變佔位塊是同一種罪。
   2 **不裁切。** 抽驗 30 張真產出物圖，寬高比從 0.77 一路到 4.21
     （2560×608 的橫幅、400×520 的豎版海報都真實存在）。
     一刀 16/10 + cover 會把橫幅裁掉大半、把豎版海報砍頭。
   3 **不跳版。** 數據裡還沒有寬高，所以先用 3/2 襯底裱框佔位，
     圖 onload 後把真比例寫回去。一次重排，換零裁切。
   ------------------------------------------------------------ */
.frame{
  display:block; aspect-ratio:3/2; background:var(--sheet);
  border:1px solid var(--rule); overflow:hidden;
}
.frame img{width:100%;height:100%;object-fit:contain;display:block}
/* 已知真實比例後：脫掉裱框，按原比例滿幅 */
.frame.nat{aspect-ratio:auto}
.frame.nat img{height:auto;object-fit:fill}
/* 豎版和方圖給個高度上限，別讓一張海報把整屏吃掉 */
.frame.nat.tall img{max-height:min(74vh,660px);width:auto;margin:0 auto}
figure.fig{margin:0 0 var(--s4)}
figure.fig figcaption,.plate figcaption{
  margin-top:9px;font:var(--t-micro)/1.6 var(--sans);color:var(--ink-4);letter-spacing:.02em;
}

/* 正文摘錄：沒有產出物圖時，拿真東西當圖 —— 這就是你要裝的東西 */
.excerpt{
  position:relative;background:var(--sheet);border:1px solid var(--rule);
  padding:22px 22px 0;max-height:400px;overflow:hidden;
}
.excerpt pre{
  margin:0;font:400 11.5px/1.95 var(--mono);color:var(--ink-3);
  white-space:pre-wrap;word-break:break-word;
}
.excerpt:after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:130px;
  background:linear-gradient(to bottom,transparent,var(--sheet));pointer-events:none;
}

/* 往期頭條 —— 專欄靠「還有上一期」活著 */
.past{margin-top:var(--s5);padding-top:var(--s3);border-top:1px solid var(--rule)}
.past .label{display:block;margin-bottom:12px}
.past ol{margin:0;padding:0;list-style:none}
.past li{padding:8px 0;border-bottom:1px solid var(--rule)}
.past li:last-child{border-bottom:0}
.past li a{display:flex;gap:12px;align-items:baseline}
.past .pd{font:var(--t-micro)/1.6 var(--mono);color:var(--ink-4);flex:0 0 auto;width:52px}
.past .pt{font:400 var(--t-meta)/1.6 var(--serif);color:var(--ink-2);min-width:0}
.past a:hover .pt{color:var(--seal)}

/* ============================================================
   判斷塊 ——「點評 / 但是」
   全站最重要的信息結構，所以單獨一節寫。

   實測（153 件在架）：
     點評 中位 39 字，最長 100
     但是 中位 106 字，最長 120，**153 件裡 125 件有，28 件沒有**
   兩件事由此定下來：

   甲 「但是」比「點評」長得多，不能當小字腳註排。層級靠**字體和顏色**
      分（宋體墨色 = 斷言，黑體次墨 = 反證），**不靠縮小**。
      v2 把它排成 13px 次灰，等於讓最長的字段最難讀。

   乙 那 28 件沒有「但是」的**不能看起來像殘廢**。所以豎線屬於「點評」，
      不屬於這一對：缺「但是」時整塊照樣閉合，不留空槽、不寫「暫無」。
      「但是」是加上去的一筆，不是撐結構的柱子。

   丙 硃色的「但」字**懸掛在豎線上**（負位移出欄），像紙上批註的一記硃筆。
      這是中文排版才有的手法，也是英文站抄不動的地方。
   ============================================================ */
.judge{border-left:2px solid var(--rule-2);padding-left:18px;margin:0 0 var(--s4)}
.judge>.label{display:block;margin-bottom:8px;color:var(--ink-4)}
.judge .v{                       /* 點評：斷言。宋體，墨色，比正文大一級 */
  margin:0; font:400 var(--t-lead)/var(--lh-body) var(--serif); color:var(--ink);
}
.judge .b{                       /* 但是：反證。黑體，次墨色，正文級——不縮小 */
  margin:.85em 0 0; padding-left:1.35em; position:relative;
  font:400 var(--t-body)/var(--lh-body) var(--sans); color:var(--ink-2);
}
/* 懸掛的「但」是視覺記號（aria-hidden），讀屏器讀的是這一句完整的「但是」 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.judge .b .mk{                   /* 懸掛的硃筆「但」 */
  position:absolute; left:-19px; top:.02em;
  width:20px; text-align:center;
  font:400 var(--t-lead)/1.35 var(--serif); color:var(--seal);
  background:var(--paper);       /* 壓住豎線，讓它像蓋在線上 */
}
/* 頭條裡的判斷塊用大一號，且豎線換成硃色 —— 它是主角 */
.headline .judge{border-left-color:var(--seal)}

/* ============ 精選 ============
   層級：頭條 1 件（大幅）→ 精選第 1 件（跨兩欄、大畫幅）→ 其餘小卡。
   154 件全平鋪就沒有推薦，有主角才有節奏。 */
.featured{padding:var(--s6) 0;border-top:1px solid var(--rule)}
.feat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--s5);row-gap:0}
.item{
  padding:var(--s5) 0 var(--s5);border-top:1px solid var(--rule);
  display:flex;flex-direction:column;
  /* 卡片自然高。不再用 margin-top:auto 把頁腳拉齊——

var COVER_DENY = /opengraph\.githubassets\.com|private-user-images\.githubusercontent\.com|buymeacoffee|hackingwithswift|shields\.io|badge|images\.weserv\.nl|gcdn\.moonshot\.cn/i;

function coverOf(it){
  if(!it) return "";
  // 甲：feed 已經帶上判斷了就直接信它
  if(it.is_real_artwork === false) return "";
  if(it.is_real_artwork === true && it.cover && !COVER_DENY.test(it.cover)) return it.cover;
  // 乙：過渡期從 covers.json 取
  var c = COVERS && COVERS[it.id];
  if(c && c.is_real_artwork === true && c.cover_url && !COVER_DENY.test(c.cover_url)) return c.cover_url;
  if(c && c.is_real_artwork === false) return "";
  // 丙：feed 自帶的老封面
  var f = it.cover;
  return (f && !COVER_DENY.test(f)) ? f : "";
}

  if(D.headline && D.headline.story_zh && D.headline.item){
    HL_PAST = (D.headline_history||[])
      .filter(function(h){ return h && h.id && h.id!==D.headline.id && h.date; })
      .sort(function(a,b){ return b.date.localeCompare(a.date) })
      .slice(0,3)
      .map(function(h){ return {h:h, it:h.item || byIdOf(skills)[h.id]}; })
      .filter(function(x){ return x.it });
    return {h:D.headline, it:D.headline.item};
  }
  return null;
}
function byIdOf(skills){ var m={}; skills.forEach(function(s){ m[s.id]=s }); return m; }

function issueNo(){
  // 期號 = 從店開張那天算起的天數。讓它像一份連續出版物。
  var start=Date.UTC(2026,5,1);
  var now=Date.parse((D&&D.generated_at)||new Date().toISOString());
  return Math.max(1, Math.round((now-start)/864e5));
}

/* ------------------------------------------------------------------
   3 · 報頭（不需要任何數據，腳本一進來就渲染）
   ------------------------------------------------------------------ */
function renderChrome(){
  document.documentElement.lang = lang==="zh" ? "zh-Hant" : "en";
  document.title = t("title");
  el("brand").textContent = t("brand");
  el("brandSub").textContent = t("brandSub");
  el("langBtn").textContent = t("btn");
  el("creed").innerHTML = t("creed");
  el("creedSub").innerHTML = t("creedSub");
  el("colo1").textContent = t("colo1");
  if(!D){
    el("issue").textContent = "";
    el("dateline").textContent = "";
    el("colo2").textContent = "";
  }
}

/* 三個真數。一個都不算、一個都不編：過手 = 上架 + 未上架，全部來自 feed。
   拿不到就整行不顯示。 */
function renderTally(){
  if(!D) return;
  var st = D.rejected_summary || {};
  var bits = [];
  function put(k, v){
    if(v==null) return;
    bits.push('<span><span class="k">'+esc(t(k))+'</span> <b>'+esc(String(v))+'</b></span>');
  }
  if(st.shelved!=null && st.unshelved!=null) put("tSeen", st.shelved + st.unshelved);
  put("tIn",  st.shelved!=null ? st.shelved : D.count);
  if(st.unshelved!=null) put("tOut", st.unshelved);
  if(D.new_today) put("tNew", D.new_today);
  // 「已寫拒收理由」等真有條目了再出現。0 條就是不顯示，不用 0 佔位。
  if(st.rejected_documented) put("tWhy", st.rejected_documented);
  el("tally").innerHTML = bits.join('<span class="sep">·</span>');

  el("issue").textContent = sprintf(t("issue"), issueNo());
  el("dateline").textContent = fmtDate(D.generated_at);
  el("colo2").textContent = t("colo2")
      .replace("%N%", D.count||0)
      .replace("%D%", fmtDate(D.generated_at));
}

/* ------------------------------------------------------------------
   4 · 版面零件
   ------------------------------------------------------------------ */
function secHeadRaw(title, note){
  return '<div class="sec-head"><div class="t"><h2>'+esc(title)+'</h2></div>'
       + '<div class="note">'+esc(note)+'</div></div>';
}
function secHead(titleKey, noteKey){ return secHeadRaw(t(titleKey), t(noteKey)); }

/* 圖版。eager=true 給頭條用（首屏那一張不該懶加載）。 */
function figHTML(it, opts){
  var cov = coverOf(it);
  if(!cov) return "";
  var o = opts || {};
  return '<figure class="fig" data-cid="'+esc(it.id)+'">'
       +   '<span class="frame"><img src="'+esc(cov)+'" alt=""'
       +     ' loading="'+(o.eager?"eager":"lazy")+'" decoding="async"'
       +     ' onerror="this.closest(\'figure\').remove()"></span>'
       +   '<figcaption>'+esc(t("figcap"))+'</figcaption>'
       + '</figure>';
}

/* ---- 徽章：只有正向檔，沒有負向檔 --------------------------------
   prep_badge 由功能開發那邊從 methods/ 存檔本地算（≥3 條證據）。
   字段還沒到就什麼都不印 —— 不猜、不估。 */
function badgesHTML(it){
  var b = [];
  if(it.prep_badge) b.push('<span class="badge">'+esc(t("prep"))+'</span>');
  if(clean(it.limit_zh)) b.push('<span class="badge read">'+esc(t("read"))+'</span>');
  return b.length ? '<div class="badges">'+b.join("")+'</div>' : "";
}

function metaBits(it){
  var bits = [];
  bits.push('<a href="'+esc(urlOf(it))+'" target="_blank" rel="noopener">'+esc(it.repo)+'</a>');
  bits.push('<span><span class="k">'+esc(t("added"))+'</span> '+esc(fmtDate(it.added_at))+'</span>');
  var also = (byAuthor[it.owner]||1) - 1;
  if(also>0) bits.push('<span>'+esc(sprintf(t("alsoN"), also))+'</span>');
  bits.push('<span>'+esc(catName(it.category))+'</span>');
  return bits.join("");
}

/* ---- 判斷塊：點評 + 但是 ------------------------------------------
   豎線屬於「點評」。「但是」缺席時整塊照樣閉合 —— 不留空槽、不寫「暫無」。
   28 件還沒寫「但是」，它們不該看起來像殘廢。 */
function judgeHTML(it, opts){
  var why = whyOf(it), lim = limitOf(it);
  if(!why && !lim) return "";
  var o = opts || {};
  return '<div class="judge">'
    + (o.label===false ? "" : '<span class="label zh">'+esc(t("verdict"))+'</span>')
    + (why ? '<p class="v">'+mix(why)+'</p>' : "")
    + (lim ? '<p class="b"><span class="mk" aria-hidden="true">'+esc(t("but"))+'</span>'
           + '<span class="sr">'+esc(t("butFull"))+'</span>'+mix(lim)+'</p>' : "")
    + '</div>';
}

/* ---- 頭條 ---- */
function storyHTML(h, it){
  // story_zh 是 120–800 字的長判斷，不是加長版點評。分段落排，讓它像正文。
  var raw = (lang==="en" && h && h.story_en) ? h.story_en : (h && h.story_zh);
  if(!raw) raw = whyOf(it);
  return String(raw).split(/\n{2,}/).map(function(p){
    return "<p>"+mix(p.trim())+"</p>";
  }).join("");
}

function pastHTML(){
  if(!HL_PAST.length) return "";
  return '<div class="past"><span class="label zh">'+esc(t("past"))+'</span><ol>'
    + HL_PAST.map(function(p){
        return '<li><a href="'+esc(urlOf(p.it))+'" target="_blank" rel="noopener">'
          + '<span class="pd">'+esc(fmtDate(p.h.date))+'</span>'
          + '<span class="pt">'+mix(nameOf(p.it))+'</span></a></li>';
      }).join("")
    + '</ol></div>';
}

function renderHeadline(rec){
  if(!rec) return '<section class="headline"><div class="wrap">'
    + secHead("hl","hlNote")
    + '<div class="empty">'+esc(t("noHeadline"))+'</div></div></section>';

  var h = rec.h, it = rec.it;

  /* 圖版三選一，按「有沒有真東西」降級：
     1 作者自己的產出物圖  2 SKILL.md 正文當圖版  3 什麼都不放，版心收成單欄。
     沒有第四種。絕不拿標題再寫一遍當圖。 */
  var plate = figHTML(it, {eager:true});
  if(!plate && METHOD){
    plate = '<div class="excerpt"><pre>'+esc(METHOD.slice(0,1500))+'</pre></div>'
          + '<figcaption>'+esc(t("excerpt"))+'</figcaption>';
  }
  var solo = plate ? "" : " solo";
  var secTitle = (lang==="zh" && h.kicker_zh) ? h.kicker_zh : t("hl");

  return '<section class="headline"><div class="wrap">'
    + secHeadRaw(secTitle, t("hlNote"))
    + '<div class="hl-grid'+solo+'">'
    +   '<div>'
    +     '<div class="hl-kicker"><span class="no">01</span>'
    +       '<span class="cat">'+esc(catName(it.category))+'</span></div>'
    +     '<h1 class="hl-title"><a href="'+esc(urlOf(it))+'" target="_blank" rel="noopener">'+mix(nameOf(it))+'</a></h1>'
    +     '<p class="hl-lead">'+zhChip(it)+mix(tagOf(it))+'</p>'
    +     badgesHTML(it)
    +     '<div class="story judge">'
    +       '<span class="label zh">'+esc(t("verdict"))+'</span>'
    +       storyHTML(h, it)
    +     '</div>'
    +     (limitOf(it) ? '<div class="judge">'
    +        '<p class="b"><span class="mk" aria-hidden="true">'+esc(t("but"))+'</span>'
    +          '<span class="sr">'+esc(t("butFull"))+'</span>'+mix(limitOf(it))+'</p>'
    +      '</div>' : "")
    +     '<p class="byline">'+esc(t("chosenBy").replace("%B", h.by||"店長").replace("%D", fmtDate(h.date)))+'</p>'
    +     '<div class="hl-meta">'+metaBits(it)+'</div>'
    +   '</div>'
    +   '<div class="plate"><div class="plate-hold">'+plate+pastHTML()+'</div></div>'
    + '</div>'
    + '</div></section>';
}

/* ---- 精選 ----
   第 1 件跨兩欄、大畫幅（有主角才有節奏），其餘 3 欄小卡。
   槽位次序對所有卡片一樣，圖缺了不補別的東西、也不換次序。 */
function featItem(it, i){
  var lead = i===0;
  var fig = figHTML(it);
  return '<article class="item'+(lead?" lead":"")+(fig?"":" noimg")+'">'
    + '<div class="item-no">'+pad(i+2)+'</div>'
    + '<h3><a href="'+esc(urlOf(it))+'" target="_blank" rel="noopener">'+mix(nameOf(it))+'</a></h3>'
    + fig
    + '<p class="tag">'+zhChip(it)+mix(tagOf(it))+'</p>'
    + badgesHTML(it)
    + judgeHTML(it)
    + '<div class="foot">'+metaBits(it)+'</div>'
    + '</article>';
}
function renderFeatured(list){
  if(!list.length) return "";
  return '<section class="featured"><div class="wrap">'
    + secHead("featured","featNote")
    + '<div class="feat-grid">'+list.map(featItem).join("")+'</div>'
    + '</div></section>';
}

/* ---- 名錄 ---- */
function filterList(all){
  var q = state.q.trim().toLowerCase();
  return all.filter(function(it){
    if(state.cat!=="all" && it.category!==state.cat) return false;
    if(!q) return true;
    return [it.name,it.title_zh,it.tagline_zh,it.tagline_en,it.desc_en,it.repo,it.owner]
      .join(" ").toLowerCase().indexOf(q) >= 0;
  });
}
function rowHTML(it, n){
  return '<div class="row'+(state.open[it.id]?" open":"")+'" data-id="'+esc(it.id)+'">'
    + '<button type="button" aria-expanded="'+(state.open[it.id]?"true":"false")+'">'
    +   '<span class="rn">'+pad(n)+'</span>'
    +   '<span class="rt">'+mix(nameOf(it))+'</span>'
    +   '<span class="rg">'+zhChip(it)+mix(tagOf(it))+'</span>'
    +   '<span class="rc">'+esc(catName(it.category))+'</span>'
    + '</button>'
    + '<div class="drawer">'+(state.open[it.id]?drawerHTML(it):"")+'</div>'
    + '</div>';
}
function drawerHTML(it){
  var ins = it.install||{};
  var cmds = "";
  if(ins.clone) cmds += '<div class="cmd">'+esc(ins.clone)+'<button data-c="'+esc(ins.clone)+'">'+esc(t("copy"))+'</button></div>';
  if(ins.copy)  cmds += '<div class="cmd">'+esc(ins.copy)+'<button data-c="'+esc(ins.copy)+'">'+esc(t("copy"))+'</button></div>';
  // 抽屜是唯一放開比例的地方：小卡里裱著的極端比例圖，這裡按原樣看
  var fig = figHTML(it);
  return '<div class="drawer-in"><div></div><div class="body">'
    + badgesHTML(it)
    + judgeHTML(it)
    + cmds
    + '<div class="links">'+metaBits(it)+'</div>'
    + '</div><div class="aside">'+fig+'</div></div>';
}

function renderIndex(all){
  var list = filterList(all);
  var q = state.q.trim();

  var filters = '<button data-cat="all"'+(state.cat==="all"?' class="on"':'')+'>'+esc(t("all"))+'<sup>'+all.length+'</sup></button>';
  (D.categories||[]).forEach(function(c){
    if(!c.count) return;
    filters += '<button data-cat="'+esc(c.id)+'"'+(state.cat===c.id?' class="on"':'')+'>'
             + esc(lang==="zh"?c.zh:c.en)+'<sup>'+c.count+'</sup></button>';
  });

  var head = '<section class="index"><div class="wrap">'
    + secHead("index","idxNote")
    + '<div class="idx-tools">'
    +   '<input id="q" type="search" autocomplete="off" value="'+esc(state.q)+'" placeholder="'+esc(t("search"))+'">'
    +   '<div class="filters" id="filters">'+filters+'</div>'
    + '</div>';

  if(!list.length) return head + '<div class="empty">'+esc(t("empty"))+'</div></div></section>';

  var body="", shown = list.slice(0, state.limit), n=0;

  if(q){
    body += '<div class="daygroup"><div class="dayhead"><span class="d">'
         +  esc(sprintf(t("results"), list.length))+'</span></div>'
         +  shown.map(function(it){ return rowHTML(it, ++n); }).join("")
         +  '</div>';
  } else {
    // 名錄是一本收錄日誌，不是商品目錄。按收錄日分組。
    var groups=[], cur=null;
    shown.forEach(function(it){
      if(!cur || cur.d!==it.added_at){ cur={d:it.added_at, items:[]}; groups.push(cur); }
      cur.items.push(it);
    });
    var newest = (D.generated_at||"").slice(0,10);
    body += groups.map(function(g){
      return '<div class="daygroup"><div class="dayhead">'
        + '<span class="d">'+esc(fmtDate(g.d))+'</span>'
        + '<span class="c">'+g.items.length+'</span>'
        + (g.d===newest ? '<span class="new">'+esc(t("newBadge"))+'</span>' : '')
        + '</div>'
        + g.items.map(function(it){ return rowHTML(it, ++n); }).join("")
        + '</div>';
    }).join("");
  }

  var rest = list.length - shown.length;
  body += rest>0
    ? '<button class="more" id="more">'+esc(sprintf(t("moreN"), rest))+'</button>'
    : '<div class="more" style="cursor:default;opacity:.5">'+esc(t("noMore"))+'</div>';

  return head + body + '</div></section>';
}

/* ------------------------------------------------------------------
   5 · 主渲染
   ------------------------------------------------------------------ */
function renderShelf(keepScroll){
  if(!D) return;
  var y = keepScroll ? window.scrollY : null;
  renderChrome();
  renderTally();

  var all = (D.skills||[]).filter(function(x){return !x.hide});
  // 名錄按收錄日倒序 —— 「今天挑了什麼」是這一頁的主語
  var sorted = all.slice().sort(function(a,b){
    return (b.added_at||"").localeCompare(a.added_at||"") || (a.title_zh||"").localeCompare(b.title_zh||"");
  });

  var head = HL ? HL.it : null, headId = head ? head.id : null;
  var picks = all.filter(function(x){ return x.pick && x.id!==headId });
  var feats = picks.slice(0,6);
  if(feats.length<6){
    sorted.forEach(function(x){
      if(feats.length<6 && x.id!==headId && feats.indexOf(x)<0) feats.push(x);
    });
  }

  el("main").innerHTML =
      renderHeadline(HL)
    + renderFeatured(feats)
    + renderIndex(sorted);

  wireIndex();
  fitFrames(el("main"));
  SHELF = true;
  if(y!=null) window.scrollTo(0,y);
}

/* ---- 圖片落地後把真比例寫回裱框 ----------------------------------
   數據裡還沒有寬高（covers.json 只有 URL），所以先用 3/2 佔位、
   onload 後改成自然比例。一次重排換零裁切；等 covers.json 帶上
   width/height，這段就可以在 HTML 裡直接寫死，重排也一起省掉。 */
function fitFrame(img){
  var w = img.naturalWidth, h = img.naturalHeight;
  if(!w || !h) return;
  var fr = img.parentNode;
  if(!fr || fr.className.indexOf("frame")<0) return;
  fr.style.aspectRatio = w+" / "+h;
  fr.className = "frame nat" + (w/h < 1.25 ? " tall" : "");
}
function fitFrames(root){
  (root||document).querySelectorAll(".frame img").forEach(function(img){
    if(img.complete) fitFrame(img);
    else img.addEventListener("load", function(){ fitFrame(img) }, {once:true});
  });
}

function wireIndex(){
  var q = el("q");
  if(q){
    q.addEventListener("input", function(){
      state.q = this.value; state.limit = 60;
      renderShelf(true);
      var n = el("q"); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    });
  }
}

/* ------------------------------------------------------------------
   6 · 交互
   ------------------------------------------------------------------ */
function copyText(txt, btn){
  var old = btn.textContent;
  function done(){ btn.textContent = t("copied"); setTimeout(function(){btn.textContent=old},1400); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else fallback();
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=txt;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){}
    document.body.removeChild(ta);
  }
}

document.addEventListener("click", function(e){
  var cp = e.target.closest(".cmd button");
  if(cp){ copyText(cp.getAttribute("data-c"), cp); return; }

  var f = e.target.closest("#filters button");
  if(f){ state.cat = f.getAttribute("data-cat"); state.limit = 60; renderShelf(true); return; }

  if(e.target.closest("#more")){ state.limit += 60; renderShelf(true); return; }

  var rb = e.target.closest(".row > button");
  if(rb){
    var row = rb.parentNode, id = row.getAttribute("data-id");
    var it = (D.skills||[]).find(function(x){return x.id===id});
    if(!it) return;
    if(state.open[id]){
      delete state.open[id];
      row.classList.remove("open"); rb.setAttribute("aria-expanded","false");
      row.querySelector(".drawer").innerHTML = "";
    } else {
      state.open[id] = 1;
      row.classList.add("open"); rb.setAttribute("aria-expanded","true");
      var dr = row.querySelector(".drawer");
      dr.innerHTML = drawerHTML(it);
      fitFrames(dr);
    }
    return;
  }
});

el("langBtn").addEventListener("click", function(){
  lang = lang==="zh" ? "en" : "zh";
  var u = new URL(location.href);
  if(lang==="en") u.searchParams.set("lang","en"); else u.searchParams.delete("lang");
  history.replaceState(null,"",u);
  if(SHELF) renderShelf(true); else renderChrome();
});

/* ------------------------------------------------------------------
   7 · 起飛
   ------------------------------------------------------------------
   一條硬規矩：**首屏不等任何 fetch。**
   報頭和立場句是靜態 HTML，腳本一進來先把文案補齊（renderChrome），
   然後才等 feed。feed 是唯一的必需數據，其餘全是後到的增強：

     feed.json      必需 · 到了就排貨架
     covers.json    可選 · 後到就補圖，拿不到就當無圖（低優先級請求）
     methods/*.md   可選 · 只在頭條沒有產出物圖時才要，永不擋首屏

   v2 是四個 fetch 一起 Promise.all，再串一個 methods/*.md ——
   五個往返之前整頁是空的。這一版把它們全挪到首屏之後。
   ------------------------------------------------------------------ */
renderChrome();
el("main").innerHTML = '<div class="wrap"><div class="empty slim">'+esc(t("loading"))+'</div></div>';

// 封面先到就先記下，不單獨觸發重排
window.__COVERS__.then(function(c){
  COVERS = (c && c.covers) || null;
  if(SHELF && COVERS) renderShelf(true);   // 貨架已經排好了才需要補圖重排
});

window.__FEED__.then(function(feed){
  D = feed;
  var live = (D.skills||[]).filter(function(x){ return !x.hide });
  live.forEach(function(x){ byAuthor[x.owner] = (byAuthor[x.owner]||0)+1; });
  HL = pickHeadline(live);
  renderShelf();          // ← 這裡就已經是完整版面了，下面兩件都是補丁

  // 頭條沒有產出物圖時，才去拿 SKILL.md 正文當圖版。晚到就補，不重排整頁。
  if(HL && !coverOf(HL.it)){
    fetch("../methods/"+HL.it.id+".md")
      .then(function(r){ if(!r.ok) throw 0; return r.text() })
      .then(function(txt){
        METHOD = txt.replace(/^---[\s\S]*?\n---\s*\n/, "").trim();
        if(METHOD) renderShelf(true);
      })
      .catch(function(){ /* 沒有存檔就沒有圖版，版心自己收成單欄 */ });
  }
}).catch(function(e){
  el("main").innerHTML = '<div class="wrap"><div class="empty">'+esc(t("failed"))+'</div></div>';
  if(window.console) console.error(e);
});

})();
</script>
