<!-- ================================================================
     早啟動。首屏不等任何 fetch —— 報頭和搜索條是靜態 HTML，
     feed 是唯一必需的數據，其餘全是後到的增強。
     ================================================================ -->
<script>
// `cache:"no-cache"` = **每次都回源問一句「變了嗎」**，沒變就吃 304（幾十字節），
// 變了就拿新的。不是 no-store（那才是每次全量重下）。
//
// 為什麼必須要：原來是裸 fetch，於是瀏覽器按 GitHub Pages 給的 TTL 直接吃本地緩存 ——
// 實測上新 74 件、改了排序之後，頁面拿到的仍是隔夜的 feed，**圖在前的新順序一件沒生效**。
// 一個首頁寫著「天天上新」的站，回頭客看到的是昨天的貨架。
// 代價是每次多一次條件請求；收益是「上新」這兩個字是真的。
window.__FEED__ = fetch("skills/feed.json", {cache: "no-cache"}).then(function(r){
  if(!r.ok) throw new Error("feed "+r.status); return r.json();
});
// 封面的一切都在 feed 裡了：cover / cover_kind / cover_real / cover_w / cover_h。
// 所以**整頁只有這一個請求**。上一版那張過渡查表已經刪掉。
</script>

<style>
/* ============================================================
   品味 · 版式原型 v4 「流」
   店主定的方向：小紅書式信息流，不是編輯部雜誌。
   雜誌版留在 design/archive-editorial.html（相對倉庫根）。

   照搬小紅書的地方：瀑布流不等高卡、圓角白卡、淺灰底、圖片主導、
   標題兩行截斷、橫滑分類膠囊、手機兩列是第一現場。

   **動過的三處，都是因為我們賣的不是圖，是判斷：**

   甲 小紅書卡底是點贊數 + 作者，我們換成「但是」。
     瀑布流為瀏覽優化，我們的貨是文字，照搬會把判斷擠沒。
     換掉之後瀏覽手感一樣，社交證明的槽位變成判斷槽位。
     副作用很好：連一句誠實短處都寫不出來的東西，在流裡就是空的，一眼看得見。

   乙 **卡上保留「點評」，不只放「但是」。** 理由見 .card .rev 那一節 ——
     只印短處的卡片是把漏斗倒過來。

   丙 GitHub OG 卡不上站。無圖卡不補佔位符，用一道墨槓起頭，
     並且把「但是」升為主角。理由見 coverOf()。
   ============================================================ */

:root{
  /* 紙是骨色，點是印泥紅。紅只給標記和句點，正文不跟貨搶顏色。 */
  --bg:      #f4f2ec;   /* 原聲同款米白 */
  --card:    #fffefa;
  --soft:    #eae7de;

  --ink:     #14120e;   /* 原來 #3a342e 灰褐，和米底對比不夠，整站發糊 */
  --ink-2:   #3d3830;
  --ink-3:   #6f6959;
  --ink-4:   #9b9484;

  --line:    #e2ddd0;
  --line-2:  #cec8b8;
  --accent:  #8b3d2f;

  /* —— 單色。**站上沒有品牌色。** ——
     brand/BRAND.md 定稿：「頁面上唯一的彩色應該來自商品的產出物圖，站不跟貨搶顏色。」
     所以上一版那個硃色的「但」、硃色上新章、硃色徽章邊全部撤掉。
     「但」的辨識度改由**位置 + 筆法**承擔：宋體、懸掛出欄、壓在豎線上。
     這個交換是賺的 —— 一張全灰的頁面上，27 張真產出物圖是唯一的顏色源，
     「產出物即封面」這句話由此變成看得見的事實，而不是一句主張。 */
  --stamp:     #1a1a1a;    /* 反白章的底：墨 */
  --stamp-fg:  #ffffff;

  --serif: 'Songti SC','Source Han Serif SC','Noto Serif CJK SC','STSong','SimSun',Georgia,serif;
  --sans:  -apple-system,BlinkMacSystemFont,'PingFang SC','HarmonyOS Sans SC',
           'Noto Sans CJK SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:  'SF Mono',ui-monospace,Menlo,Consolas,monospace;

  /* 字號階梯。手機兩列的卡寬只有 ~177px，所以卡內字號必須比桌面小一檔，
     階梯本身不變 —— 靠斷點換值，不靠局部另發明。 */
  --t-micro: 10.5px;
  --t-cap:   11.5px;
  --t-meta:  12.5px;
  --t-body:  14px;
  --t-lead:  15.5px;
  --t-h3:    17px;
  --t-h2:    22px;
  --t-h1:    30px;

  --lh-tight: 1.34;
  --lh-body:  1.72;
  --lh-long:  1.92;

  --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:28px; --s6:44px; --s7:72px;

  --r-card: 14px;
  --shadow: 0 1px 2px rgba(20,18,14,.05), 0 8px 24px -16px rgba(20,18,14,.18);
  --r-chip: 999px;
  --r-img:  10px;

  --gut: 10px;
  --cols: 2;
}

/* 深色跟隨已移除：店主判斷「深色太壓抑，看久了會很累」。 */

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:var(--t-body)/var(--lh-body) var(--sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  hanging-punctuation: allow-end;
}
@supports (text-spacing-trim: space-first){ body{ text-spacing-trim: space-first } }
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
::selection{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
img{max-width:100%}

/* 中英混排的那一口氣。JS 在 CJK / 拉丁邊界插一個空的 <i class="g">，
   靠 margin 造縫，不插真空格 —— 複製出去還是乾淨原文。
   英文站不需要做，也做不了，正好是我們該做到的地方。 */
i.g{font-style:normal;display:inline;margin:0 .085em}

html,body{overflow-x:hidden}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;min-width:0}

/* ============ 報頭 ============
   整塊靜態 HTML。三個真數（過手 / 上架 / 未上架）落在 #tally，
   數據到了才填；沒填的時候上面那句主張照樣讀得通。 */
header.top{padding:clamp(26px,5vw,48px) 0 0;border-bottom:1px solid var(--line);margin-bottom:18px;padding-bottom:18px}
.mast-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.logo{display:flex;align-items:flex-end;gap:12px;color:inherit;text-decoration:none}
.logo svg{width:22px;height:36px;color:var(--ink)}
.logo b{
  font-family:var(--serif);font-weight:700;font-size:clamp(34px,6vw,52px);
  line-height:.98;letter-spacing:-.015em;color:var(--ink);
}
.logo b::after{content:".";color:var(--accent)}
.slogan{margin:8px 0 0;color:var(--ink-3);font-size:13.5px;font-weight:400;letter-spacing:.02em}
.mast-side{display:flex;align-items:center;gap:7px;padding-bottom:4px}
.pill{
  display:inline-flex;align-items:center;height:32px;padding:0 13px;
  border:1px solid var(--line-2);border-radius:999px;font-size:12.5px;
  color:var(--ink-2);background:var(--card);white-space:nowrap;cursor:pointer;
}
.pill:hover{border-color:var(--ink);color:var(--ink)}

/* ============ 搜索條 + 橫滑膠囊 ============
   兩行都 sticky。手機上這是唯一的導航。 */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 12px;
     display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;max-width:100%}
.search{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-chip);
  padding:0 16px;height:40px;flex:0 1 260px;min-width:180px;
}
.search svg{flex:0 0 auto;opacity:.42}
.search input{
  flex:1;min-width:0;background:none;border:0;outline:none;
  font:var(--t-body)/1 var(--sans);color:var(--ink);height:100%;
}
.search input::placeholder{color:var(--ink-4)}
.search .clr{
  display:none;background:none;border:0;cursor:pointer;color:var(--ink-4);
  font-size:16px;line-height:1;padding:4px;
}
.search.has .clr{display:block}

/* 橫滑膠囊。八個貨架直接當膠囊，滾動條藏起來。 */
.chips{
  /* 2026-09-03 照原聲（/podcast/）重寫。原來是橫向滾動 + 兩端淡出遮罩 + scroll-snap：
     桌面上明明放得下卻被遮罩切掉一截、chip 比搜索框高一檔、字號也不一致 —— 店主說「tab 樣式很奇怪」。
     原聲的做法：換行排、30px、細邊、靜色，按下時墨底反白。 */
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1 1 100%;min-width:0;
}
.chip{
  flex:0 0 auto;height:30px;padding:0 12px;display:inline-flex;align-items:center;
  background:var(--card);border:1px solid var(--line-2);border-radius:999px;
  cursor:pointer;white-space:nowrap;
  font:500 12.5px/1 var(--sans);color:var(--ink-3);transition:color .15s,border-color .15s,background .15s;
}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .cnt{font:10.5px/1 var(--mono);font-style:normal;opacity:.55;margin-left:5px}
.chip.on .cnt{opacity:.7}

/* 今日上新一條窄帶。瀑布流沒法按天分組（多列會把日期打散），
   所以「今天挑了什麼」提到流的上面單獨說一句，不塞進流裡。 */
.todayline{
  margin:var(--s4) 0 0;display:flex;align-items:center;gap:10px;
  font:var(--t-meta)/1.5 var(--sans);color:var(--ink-3);
}
.todayline .dot{width:5px;height:5px;border-radius:50%;background:var(--ink);flex:0 0 auto}
.todayline b{color:var(--ink);font-weight:600}

/* ============ 瀑布流 ============
   用 CSS 多列，不上 JS masonry。
   ▸ 已知的取捨：多列是**按順序灌滿一列再下一列**，不是「哪列短往哪放」。
     所以最新的一批會集中在最左列，而不是橫著鋪開。
     換來的是零 JS、零重排、縮放不抖。今日上新那條窄帶就是為了補這個。 */
.flow{
  columns:2;
  column-gap:var(--gut);
  margin:12px 0 0;
}
.flow > *{
  break-inside:avoid;
  -webkit-column-break-inside:avoid;
  page-break-inside:avoid;
  width:100%;
  display:block;
}
/* .card{margin:0} 定義在後面，選擇器權重相同就贏了這一局 ——
   卡片之間因此完全沒有縱向間距。用 .flow > .card 提高權重壓住它。 */
.flow > .card,
.flow > *{
  margin:0 0 var(--gut) !important;
}
@media (max-width:620px){
  :root{
    --gut:8px;
    --t-body:13.5px;--t-lead:14.5px;--t-h3:15.5px;--t-h2:20px;--t-h1:30px;--t-meta:11.5px;--t-cap:10.5px}
  .wrap{padding:0 max(12px, env(safe-area-inset-left)) 0 max(12px, env(safe-area-inset-right))}
  .logo b{font-size:30px}
  .bar{flex-direction:column;align-items:stretch;gap:8px}
  .search{flex:1 1 auto;max-width:none;min-width:0}
  .chips{flex:1 1 auto;width:100%}
  .flow{gap:8px;margin:10px 0 0}
}

.card{
  break-inside:avoid;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  margin:0;overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .18s ease,border-color .18s,box-shadow .18s;
  cursor:pointer;display:block;
}
/* 整張卡是一個按鈕，但**不能**用 <button> 標籤 —— button 裡只允許放
   phrasing content，塞 <h3>/<p> 是非法的。用 article + role=button，
   鍵盤由下面那個 keydown 處理器接。 */
.card[role="button"]{-webkit-tap-highlight-color:transparent}
.card:hover{border-color:var(--line-2)}
.card:active{transform:scale(.994)}

/* ---- 封面 ------------------------------------------------------
   寬高比在 HTML 裡就寫死（design/cover-dims.json 實測 97/97），
   所以圖片加載前空間就佔好了，**瀑布流不會跳版**。
   等 editorial/covers.json 帶上 width/height，這個文件刪掉、邏輯不變。
   實測寬高比 0.46 – 4.69：超寬 20 件、豎版 6 件。
   所以不裁切，只給一個 max-height 兜住最豎的那幾張。 */
/* 一道內描邊（inset shadow，不佔布局尺寸）。**沒有它，淺底圖在淺底站上會看起來像壞圖。**
   實測：奧數那件的封面是米色底加細黑線的幾何圖，貼到米色卡片上，
   截圖裡就是一個空灰框 —— 圖其實加載成功了（620×818，complete=true），
   是**卡片和圖之間沒有邊界**。這不是那一張的問題，是所有淺底產出物圖的問題，
   而「代碼畫的乾淨線稿」正是我們最想要的那一類封面。
   用 inset 而不是 border：border 會參與寬高計算，把寫死的寬高比頂歪，瀑布流就跳版了。 */
.shot{display:block;background:var(--soft);position:relative;overflow:hidden;
      box-shadow:inset 0 0 0 1px var(--line)}
.shot img{width:100%;height:auto;display:block;object-fit:contain;object-position:center top;position:relative;z-index:1}
.shot .plate-ink{
  position:absolute;inset:0;padding:18px 16px 16px;
  display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(135deg,var(--soft),#f9f7f1);
}
.shot .plate-cat{
  font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:10px;
}
.shot .plate-title{
  font:600 18px/1.28 var(--serif);color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.shot.hasimg .plate-ink{display:none}
.share{
  margin-left:auto;background:none;border:1px solid var(--line-2);color:var(--ink-3);
  font:600 var(--t-micro)/1 var(--sans);letter-spacing:.08em;
  padding:6px 10px;border-radius:var(--r-chip);cursor:pointer;
}
.share:hover,.share.on{border-color:var(--ink);color:var(--ink)}
a.card{color:inherit}
/* 豎過頭的限個高，別讓一張海報把一列吃掉。
   artwork 那一檔放寬到 620px：最豎那張（比 0.46）在桌面五列自然高 570px，
   卡在 420px 會把剛放寬的下限又用 max-height 裁回去。 */
/* 心標的**點擊區**撐到 44×44，視覺尺寸一個像素不變。
   實測 22×18px —— WCAG 下限 24×24、HIG 建議 44×44，兩條都不滿足。
   真正貴的是失手代價：卡片本身是 role="button"，從心標中心下偏 16px 命中 `.cbody`、
   左偏 16px 命中 `.foot` —— **失手不是「沒點到」，是「打開了詳情彈層」**，
   得先關掉再重試。而心選是店裡最高等級的信號（`.sendbar` 自己寫著
   「提交後我會據此改選品標準」），入口卻是全站最小的可點目標。 */
.card:hover{transform:translateY(-3px);border-color:var(--line-2);
  box-shadow:0 2px 4px rgba(20,18,14,.06),0 18px 40px -22px rgba(20,18,14,.32)}
.card .heart{position:relative}
.card .heart::after{content:"";position:absolute;inset:-13px -11px}

/* 心選提交面板。**正文不走網址** —— 見 sendHearts 那段註釋：
   原來把正文塞進 issue URL，店主標了幾十件之後 GitHub 直接回
   「Your request URL is too long」，一件都交不出來。 */
.heartout{position:fixed;inset:0;z-index:60;display:none;
  background:rgba(27,26,25,.34);padding:var(--s4);overflow:auto}
.heartout.on{display:block}
.ho-in{max-width:44rem;margin:6vh auto;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-img);padding:var(--s4)}
.ho-tip{margin:0 0 var(--s3);color:var(--ink-2);font-size:var(--t-meta);line-height:1.6}
.ho-in textarea{width:100%;box-sizing:border-box;font:inherit;font-size:var(--t-meta);
  line-height:1.6;color:var(--ink-1);background:var(--soft);border:1px solid var(--line);
  border-radius:8px;padding:var(--s3);resize:vertical}
.ho-btns{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.ho-btns button{font:inherit;font-size:var(--t-meta);padding:.5em 1.1em;cursor:pointer;
  border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink-1)}
.ho-btns button[data-ho="issue"]{background:var(--ink-1);color:var(--card);border-color:var(--ink-1)}
/* 豎幅限高只剩一條：寬度那道閘在 JS 裡（H_MAX_K），這裡是視口那道。 */
.shot.tallcap{max-height:min(78vh,620px)}
/* 被限高的極端豎幅：cover + 頂部對齊。contain 會在底部留一條空帶，
   那正是「空洞」本身 —— 用一個空洞換另一個沒有意義。裁掉的是底部，頭還在。 */
.shot.capped img{height:100%;object-fit:cover;object-position:center top}
/* 默認預覽卡：能上卡，但是最後一檔 —— 去飽和、壓對比、四邊留一圈底色，別和真封面搶 */
.shot.plate-only{aspect-ratio:2/1;background:linear-gradient(135deg,var(--soft),#f9f7f1);
  display:flex;align-items:flex-end;justify-content:space-between;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line)}
.shot.plate-only .plate-glyph{font:700 clamp(44px,26%,72px)/.9 var(--serif);color:var(--ink);opacity:.14;letter-spacing:-.04em;
  position:absolute;right:10px;top:6px;font-size:min(96px,42cqw)}
.shot.plate-only{container-type:inline-size}
.shot.plate-only .plate-kicker{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* ---- 無圖卡：一道短墨槓起頭 ------------------------------------
   不補佔位符、不放 OG 卡。56 件沒有真產出物圖，無圖必須是一等公民。
   墨槓是這張卡的「圖」——它告訴你下面是一段判斷，不是一張截圖。 */
.bar-ink{display:none}
.card.noimg .bar-ink{
  display:block;height:3px;width:34px;background:var(--ink);
  margin:var(--s4) var(--s4) 0;border-radius:2px;
}
.card.noimg .cbody{padding-top:var(--s3)}

.cbody{padding:15px 17px 17px;display:flex;flex-direction:column;gap:9px}

/* 標題：兩行截斷。
   ⚠️ **下面這兩行舊賬已經不成立了，留著是為了讓人看見它怎麼過期的：**
     「實測標題中位 12 字、最長 27 字，手機兩列會截掉 14/152（9%），桌面五列 1/152」
   那是 152 件時候的數。157 件的今天重量（Chromium、淺色、真機，feed 2026-08-19T12:07Z）：
     title_zh 中位 **19 字**、最長 36 字（數據側復算：feed.json）
     375px 兩列（文字寬 135px）：**72/157 真掉了字**（中位掉 4 字、最多掉 13 字），
       另有 10 條差 1–2px 的臨界
     1280px 四列：0/157
   掉的同樣是句尾那幾個字，跟英文那邊一模一樣：
     「把「要高級要有質感」變成能確認的方 ⟦向稿⟧」
     「禁止「結尾再掏出一件磨損物件」的荒誕 ⟦超短篇寫手⟧」
     「禁止說「我聽到了」和「需要我都在」的 ⟦自省鏡子⟧」
   —— 露出來的半句讀著像說完了，而它已經不是原來那句判斷。

   **這一條我沒有自己改，因為它不是缺陷，是手感取捨，該店主定。**
   英文那兩處補行的代價是 7 張卡長高；中文補到 3 行要 82 張卡長高（還剩 5 條被夾），
   補到 4 行才 0 條被夾 —— 那是整條流的節奏變了，不是我一個人能拍的板。
   已改成 3 行（產品 2026-08-19 拍板）。判據：157 件裡 72 件在 2 行下掉了字，
   而**掉的是句尾那個名詞**——剩下半句讀起來像說完了，可它已經不是原來那句判斷。
   這跟「誠實變成營銷」是同一個形狀，只不過發生在標題上。
   我們剛花一整輪把鉤子寫進 60 條標題裡，46% 被夾掉句尾等於那輪白做。

   為什麼不是 4 行：4 行才 0 條被夾，但那要 82 張卡長高一檔，整條流的節奏就變了。
   3 行讓版式吸收掉絕大多數，**剩下的幾條按文案縮短，不讓版式遷就個例**。 */
.card h3{
  margin:0;font:700 19px/1.34 var(--serif);color:var(--ink);letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
/* ---- 英文標題多給一行（手機再多一行）--------------------------------
   **兩行這個數是按中文的字寬定的，拉丁字母裝不下。** 同樣的框：
   中文一行約 9 個字，英文一行約 3.5 個詞。title_en 中位 8 詞、最長 13 詞。
   （下面這組兩行的實測是 171 件那一版的，貨架已降到 157，比例照樣成立，
     沒重量是因為結論不靠它 —— 靠的是下面那組按當前 feed 重量過的數。）
     375px 兩列（文字寬 134.5px）  4/171 = 2%     中文同處 142/171
     414px 兩列（154px）          26/171 = 15%
     1280px 四列（264.5px）      165/171 = 96%
     1440px 五列（233.5px）      141/171 = 82%   ← 列多反而更窄
   而這批標題的判斷**全落在末尾**（"…that flags its own unverified claims"），
   砍掉的三個詞正是那句判斷本身：375px 下「A school that leaves the…」
   ——leaves the 什麼，一個字都沒剩。這不是難看，是這一格不再是判斷，
   跟 D3 講的「誠實被砍成鉤子」是同一類錯。

   所以按字寬差異補行，不改文案：
     桌面四行 → 157/157 完整
     手機五行 → 157/157 完整
   （D23：夾行留省略號是允許的；這裡做的是把「夾掉判斷」降回「一個字都不夾」。）

   ---- 上一版停在「桌面 3 行 / 手機 4 行」，那兩個數不夠，實測補上 ----
   上一版把剩下的 7 條判成「title_en 超出 4–9 詞上限」的數據欠賬，不補行。
   （那 7 條一條沒少：157 件這一版下架的 14 件是「非 C 端」，不是這 7 條。）
   我把這 7 條逐條量了一遍被夾掉的**具體是哪幾個詞**，這個判斷不成立：

     Kusama for loneliness, Miró for warmth — a daily five-senses │ wallpaper
     A noir interrogation game that hashes the killer before you  │ start
     The absurdist flash-fiction writer banned from ending on a worn │ object
     Count how many times you said please, then sentence you to   │ 2126
     An ADHD CBT coach that shrinks the homework when confidence  │ drops below 7
     Pull the narration hidden inside graded-reader PDFs, page by │ page
     A 0–13 parenting advisor that will not take one source's word for │ it

   **掉一個詞比掉三個詞更壞**：掉三個詞讀者看得出話沒說完；
   掉的是句末那個名詞（wallpaper / object / start），剩下那半句讀起來像說完了，
   而它已經不是原來那句判斷了 —— 這正是上面那段自己寫的「夾掉判斷」。

   代價實測為零，所以沒有理由不補（157 件這一版重量過）：
     375px 兩列：7 條各需**恰好一行**，157 條裡只有這 7 條長高，其餘 150 條一像素不動
     800px 三列（最窄的桌面檔）：3 行時 ADHD 那條掉「drops below 7」；4 行後 0 條被夾，
       且只有那 1 條長高
     1280px / 1440px：3 行和 4 行渲染完全一致（沒有任何標題需要第 4 行）
   已知未解：320px 兩列（文字寬 107px）五行仍夾約 10 條（171 件那版量的是 11 條）。
   320 不是設計目標寬度，記在這兒不假裝它不存在。 */
html[lang="en"] .card h3{-webkit-line-clamp:4}

/* ---- 點評 ------------------------------------------------------
   **這一塊是我加回去的，產品的稿裡沒有。**
   產品的版本是「標題 + 但是」，把「點評」全挪進詳情。我不同意：
   一張只印短處的卡片是把漏斗倒過來 —— 讀者拿到的全是不裝的理由，
   一個裝的理由都沒有。「但是」是配重，它得有個東西可配。
   所以卡上是「點評兩行 + 但是一行」，兩句都在，短處仍在社交證明的位置上。 */
/* ---- 夾行把層級鎖死，跟字段長度無關 ----------------------------
   店主報「但是壓過點評」。根因不在字號也不在行高，在我自己那條
   `.card.noimg .but .tx{line-clamp:4}` —— 無圖卡上我把「但是」放到 4 行、
   點評留 2 行，於是最長的那句壓過了該當主角的那句。是我做錯了。

   現在層級由**夾行行數**鎖死：點評 ≥ 但是，恆成立。
   `limit_zh` 中位 107 字、`limit_brief_zh` 目標 ≤30 字，差 3.5 倍 ——
   夾行之後兩者都是固定高度，所以這個倒置在字段填滿前後都不會再出現。 */
.card .rev{margin:0;color:var(--ink-2);font:14px/1.66 var(--sans);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

/* ---- 但是：佔掉小紅書的點贊位 ----------------------------------
   實測「但是」中位 107 字、最長 134 字。手機兩列每行約 12 字，
   107 字要 8.9 行 —— 夾到兩行只露 22%，那不叫誠實，那叫鉤子。
   所以優先用短版字段（limit_short_zh，還沒有就等內容那邊定），
   拿不到才退回夾行，並且**夾行時在句讀處斷**，不在半個詞上斷。
   硃色的「但」掛在最前面，是全卡唯一的彩色。 */
.but{
  margin:var(--s3) 0 0;padding-top:var(--s3);border-top:1px solid var(--line);
  font:var(--t-meta)/1.66 var(--sans);color:var(--ink-3);
  display:flex;gap:6px;align-items:flex-start;
}
/* 「但」：宋體、比正文重一檔、墨色。不靠顏色，靠筆法和位置。 */
.but .mk{
  flex:0 0 auto;font:600 var(--t-body)/1.45 var(--sans);color:var(--ink);
}
.but .tx{
  min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
/* 沒寫「但是」的那 20 件：這一格就是空的，而且看得出來是空的。
   這是產品那個換位設計最好的副作用，別去補它。 */
.but.none{color:var(--ink-4)}
.but.none .mk{color:var(--line-2);font-weight:400}

/* 無圖卡：撐起這張卡的是**點評**，不是「但是」。
   上一版我把「但是」放到 4 行，結果它壓過了點評 —— 改成把**點評**放寬到 5 行，
   「但是」始終 2 行。整張卡還是一段判斷，但主角是「它好在哪」，
   而不是「它哪兒不行」。只印短處的卡片是把漏斗倒過來。 */
.card.noimg .rev{-webkit-line-clamp:5}

/* ---- 右下徽章：只有正向檔 --------------------------------------
   星數在前端已經徹底沒有出口。替代信號兩個，都只在「有」的時候出現：
   一個只有一段提示詞的極簡 skill 可能恰恰是好東西，
   給它印「備料少」就是把星數的錯誤換個馬甲再犯一次。 */
.foot{margin-top:auto;padding-top:11px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:10.5px/1 var(--mono);color:var(--ink-4);letter-spacing:.03em}
.tagn{font:11px/1.4 var(--sans);color:var(--ink-3);background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
/* ---- 心標 ----------------------------------------------------------
   店主的手動信號，凌駕於一切機器信號之上：他點了，就是最高等級。
   站是純靜態沒有後端，所以點心只寫 localStorage、不產生任何請求；
   攢夠了在「心選」裡一次性提交成一個預填的 GitHub Issue。
   這是全站唯一一處彩色 —— 它不是裝飾，是唯一一個「你的狀態」。 */
.heart{
  flex:0 0 auto;background:none;border:0;padding:2px 4px;
  line-height:1;cursor:pointer;color:var(--ink-4);
  transition:transform .12s ease, color .12s ease;
}
.heart:hover{color:#b8452f;transform:scale(1.15)}
.heart svg{display:block;width:14px;height:14px}
.heart[aria-pressed="true"]{color:#b8452f}
.heart[aria-pressed="true"] svg path{fill:currentColor}
.chip.heartchip{border-color:#e3c4bd;color:#b8452f}
.chip.heartchip.on{background:#b8452f;border-color:#b8452f;color:#fff}
/* ⚠️ 間距規矩：任何直接落在 #main 裡的塊，上邊距一律 var(--s4)，
   手機斷點裡一律 var(--s3) —— 跟 .todayline / .flow 對齊。
   加新塊時先看這兩個兄弟怎麼排的，別只顧著自己跟下面的距離。
   （這條是補出來的：心選說明條當初寫成 margin-top:0，緊貼 sticky 分割線。）

   落在 #main 裡的塊一共五個，現在的賬：
     .todayline · .sendbar · .flow · .empty  —— 都守這條規矩
     .more                                   —— 例外，見它自己那節
   `.empty` 原來也是 margin-top:0，而且**真的復現了這條規矩要防的那件事**：
   心選裡把最後一件取消心標 → head 為空串 → .empty 成為 #main 唯一的孩子，
   實測（375px）它的上沿離 sticky 分割線**恰好 0px**。補上。 */
.sendbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin:var(--s4) 0 0;padding:12px 14px;background:var(--soft);
  border:1px solid var(--line);border-radius:10px;
  font:var(--t-cap)/1.6 var(--sans);color:var(--ink-2);
}
.sendbar button{
  margin-left:auto;font:600 var(--t-cap)/1 var(--sans);cursor:pointer;
  background:var(--ink);color:var(--card);border:0;padding:9px 14px;border-radius:7px;
}
.badge{
  flex:0 0 auto;font:600 var(--t-micro)/1 var(--sans);letter-spacing:.06em;
  border:1px solid var(--line-2);color:var(--ink-3);
  padding:4px 6px;border-radius:5px;white-space:nowrap;
}
/* 三個章共用一套單色詞彙，靠**填充與描邊**分層，不靠顏色：
   上新 = 實心反白（最響）· 店長讀過 = 墨色描邊（中）· 備料齊 = 淡描邊（輕） */
.badge.read{border-color:var(--ink-3);color:var(--ink)}
.newdot{
  flex:0 0 auto;font:600 var(--t-micro)/1 var(--sans);letter-spacing:.08em;
  background:var(--stamp);color:var(--stamp-fg);padding:4px 6px;border-radius:5px;
}

/* 「中文」標。英文版遇到沒英文文案的商品時掛在點評前面。
   中文創作者的東西在英文目錄站裡搜不到，這正是本店存在的理由 ——
   所以它是標籤，不是錯誤提示。少了這個標，英文讀者看到一段中文點評
   只會以為頁面壞了。 */
.zhchip{
  display:inline-block;font:600 var(--t-micro)/1 var(--sans);letter-spacing:.08em;
  color:var(--ink);border:1px solid var(--ink-3);border-radius:4px;
  padding:2px 4px;margin-right:4px;vertical-align:1px;white-space:nowrap;
}

/* 合集角標：這張卡的契約和別的不一樣，流裡就得看得出來 */
.packtag{
  position:absolute;left:8px;top:8px;z-index:2;
  font:600 var(--t-micro)/1 var(--sans);letter-spacing:.06em;
  background:rgba(0,0,0,.62);color:#fff;padding:5px 7px;border-radius:5px;
  backdrop-filter:saturate(140%) blur(2px);
}
.card.noimg .packtag{position:static;display:inline-block;margin:var(--s4) 0 0 var(--s4);background:var(--ink)}

/* `.more` 是上面那條 #main 間距規矩的**唯一例外**，s5 不是 s4：
   它不開一個段落，它是流的收尾鍵，前面那張卡還帶著 var(--gut) 的下沿。
   規矩要防的是「貼著 sticky 分割線」，28px 不是那件事。刻意留著，不是漏改。 */
.more{
  display:block;width:100%;margin:var(--s5) 0 0;padding:15px 0;
  background:var(--card);border:1px solid var(--line-2);color:var(--ink-2);
  font:var(--t-meta)/1 var(--sans);letter-spacing:.1em;cursor:pointer;border-radius:var(--r-chip);
}
.more:hover{border-color:var(--ink);color:var(--ink)}
.empty{margin:var(--s4) 0 0;padding:var(--s6) 0;color:var(--ink-4);font:var(--t-lead)/1.7 var(--sans);text-align:center}

/* ============ 詳情：手機是底部抽屜，桌面是居中卡 ============ */
.veil{
  position:fixed;inset:0;z-index:60;background:rgba(20,18,16,.44);
  display:none;align-items:center;justify-content:center;padding:var(--s4);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.veil.open{display:flex}
.sheet{
  background:var(--card);border-radius:var(--r-card);
  width:min(680px,100%);max-height:min(88vh,900px);overflow:auto;
  position:relative;padding:var(--s5);
}
.sheet .x{
  position:absolute;right:10px;top:10px;width:32px;height:32px;
  background:var(--soft);border:1px solid var(--line);border-radius:50%;
  cursor:pointer;font-size:17px;line-height:1;color:var(--ink-3);
}
.sheet .x:hover{color:var(--ink);border-color:var(--line-2)}
.sheet h3{margin:0 var(--s5) var(--s2) 0;font:500 var(--t-h2)/var(--lh-tight) var(--sans)}
.sheet .repo{font:var(--t-cap)/1.6 var(--mono);color:var(--ink-3);word-break:break-all}
.sheet .repo a{border-bottom:1px solid var(--line-2)}
.sheet .repo a:hover{color:var(--ink);border-color:var(--ink)}
.sheet .shot{border-radius:var(--r-img);margin:var(--s4) 0 0;border:1px solid var(--line)}
.sheet .lead{margin:var(--s4) 0 0;font:var(--t-lead)/var(--lh-body) var(--sans);color:var(--ink-2)}
.shotcap{
  margin:9px 0 0;font:var(--t-micro)/1.65 var(--sans);color:var(--ink-4);letter-spacing:.02em;
}
.shotcap b{color:var(--ink-2);font-weight:600}
/* 真產出物圖的圖注墨一檔 —— 它是證據，語氣可以肯定 */
.shotcap.real{color:var(--ink-3)}
/* `ours` 是唯一一句我們自己背書的話，墨色重一級 —— 它不是免責聲明，是證據。 */
.shotcap.ours{color:var(--ink-2);font-weight:600}
/* 復現憑據：比圖注小一檔、不加重 —— 它是給要核的人看的腳註，不是賣點。 */
.covernote{
  margin:6px 0 0;font:var(--t-micro)/1.75 var(--sans);color:var(--ink-3);
  padding-left:10px;border-left:1px solid var(--line-2);
}
.covernote code{
  font:11px/1.6 var(--mono);background:var(--soft);border:1px solid var(--line);
  border-radius:4px;padding:1px 4px;color:var(--ink-2);overflow-wrap:anywhere;
}
.prepwhy{margin:var(--s4) 0 0;font:var(--t-cap)/2 var(--sans);color:var(--ink-3)}
.prepwhy span{
  display:inline-block;margin:0 4px 0 6px;padding:2px 6px;
  border:1px solid var(--line-2);border-radius:4px;color:var(--ink-2);
}
.packnote a{border-bottom:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.packnote a:hover{color:var(--ink);border-color:var(--ink)}

/* 詳情裡的判斷塊：點評 + 但是 一體。
   豎線屬於「點評」，不屬於這一對 —— 20 件沒寫「但是」的，整塊照樣閉合，
   不留空槽、不寫「暫無」。「但是」是加上去的一筆，不是撐結構的柱子。 */
.judge{margin:var(--s4) 0 0;border-left:2px solid var(--ink);padding-left:16px}
.judge .lb2{margin-top:var(--s4)}
.judge .lb{
  display:block;margin-bottom:7px;
  font:600 var(--t-micro)/1 var(--sans);letter-spacing:.3em;color:var(--ink-4);
}
.judge .v,
.judge .b{margin:0;font:400 var(--t-lead)/var(--lh-long) var(--sans);color:var(--ink)}
/* .b 原來也帶 margin-top:var(--s4)，它和 .lb 的 margin-bottom:7px 相鄰摺疊成 18px，
   於是「但是」這個標籤上下各 18px —— **等距，也就是不歸屬任何一段**。
   實測（1100px 淺色）：Verdict 標籤到它自己那段 7px，But 標籤到它自己那段 18px。
   兩個標籤樣式一模一樣、間距卻不一樣，D2 要的「兩條平行」在版式上沒成立。
   段間距由 .lb2 的 margin-top 單獨負責，標籤一律貼著自己那段。
   中文兩個字的標籤看不太出來，英文是一個詞，一眼就散。 */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.sheet h4{
  margin:var(--s5) 0 var(--s2);font:600 var(--t-meta)/1 var(--sans);
  letter-spacing:.2em;color:var(--ink-4);
}
.step{font:var(--t-meta)/1.6 var(--sans);color:var(--ink-3);margin:var(--s3) 0 var(--s1)}
.cmd{
  position:relative;background:var(--soft);border:1px solid var(--line);border-radius:8px;
  padding:11px 60px 11px 12px;margin:var(--s1) 0;
  font:12px/1.65 var(--mono);color:var(--ink-2);white-space:pre-wrap;word-break:break-all;
}
.cmd button{
  position:absolute;right:7px;top:7px;background:var(--card);border:1px solid var(--line);
  color:var(--ink-3);font:var(--t-micro)/1 var(--sans);padding:5px 8px;border-radius:5px;cursor:pointer;
}
.cmd button:hover{border-color:var(--ink);color:var(--ink)}
/* 合集指路。最後半句加粗 —— 它說清了這張卡為什麼跟別的不一樣。 */
.packnote{margin:var(--s2) 0 0;font:var(--t-meta)/1.75 var(--sans);color:var(--ink-3)}
.packnote code{
  font:12px/1.6 var(--mono);background:var(--soft);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;color:var(--ink);
}
.packnote b{color:var(--ink);font-weight:600}
.safety{margin:var(--s4) 0 0;font:var(--t-cap)/1.7 var(--sans);color:var(--ink-4)}

@media (max-width:760px){
  /* ---- 手機首屏必須見貨 ------------------------------------------
     店主：「小紅書是打開就見貨，我們打開先見一整屏自我介紹。」
     原來報頭走完約 800px，而 iPhone 視口 812px —— 第一張卡剛好被推出去。

     砍的順序是按「這一行是立場還是導航」來的：
       · TASTE 副標 —— 裝飾，手機上直接不要
       · 「叫 SKILL.md 的文件已經百萬量級…」兩行大字 —— **是立場，不是導航**。
         手機上收掉，換成 slogan 頂上：「挑得少，是因為看得多」本來就是
         BRAND.md 定義的「那三個數字的註腳」，9 個字說的是同一件事。
         桌面保留完整那句。
       · 報頭上下留白壓掉一檔
     ---------------------------------------------------------------- */
  .brandrow i{font-size:var(--t-cap)}
  .say{display:none}
  header.top{padding:var(--s4) 0 var(--s2)}
  .tally{margin-top:var(--s3);font-size:var(--t-meta)}
  .bar{padding-top:var(--s2)}
  .chips{margin-top:var(--s2)}
  .todayline{margin-top:var(--s3)}
  .sendbar{margin-top:var(--s3)}
  .flow{margin-top:var(--s3)}
  .empty{margin-top:var(--s3)}
  /* 手機兩列的框最窄（375px 下只有 134.5px），英文標題再多一行 —— 見上面那節 */
  html[lang="en"] .card h3{-webkit-line-clamp:5}
  /* 中文也放到 4 行。實測 3 行會切字：6 個 scrollHeight 超標裡有 3 個真丟字，
     最慘的是「從分鏡到渲」把「染」切掉了 —— 一個字被切掉，那句話就不成句。
     **不花錢**：line-clamp 只封頂、不預留高度，另外 223 張卡高度一個像素不變。 */
  .card h3{-webkit-line-clamp:4}
  /* 手機是第一現場：詳情從底部推上來，不是居中彈窗 */
  .veil{align-items:flex-end;padding:0}
  .sheet{
    width:100%;max-height:92vh;
    border-radius:var(--r-card) var(--r-card) 0 0;padding:var(--s4);
  }
  .judge{padding-left:13px}
}

footer{border-top:1px solid var(--line);margin-top:var(--s6);padding:var(--s5) 0 var(--s7)}
footer p{margin:0 0 8px;font:var(--t-cap)/1.8 var(--sans);color:var(--ink-3);max-width:34em}
footer .links{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:var(--s3);font:var(--t-cap)/1.6 var(--mono)}
footer .links a{color:var(--ink-3);border-bottom:1px solid var(--line)}
footer .links a:hover{color:var(--ink);border-color:var(--ink)}
footer .fam a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<style id="hwx-en-type">
/* 英文版按雜誌排：Playfair Display 做標題，Source Serif 4 做正文
   —— 和主站英文頁同一套，兩個站看起來是一家的。

   為什麼英文非得單獨一套：--serif / --sans 裡排在前面的是中文字體
   （宋體、蘋方），它們的西文字形是為「和漢字並排」設計的 —— 窄、
   低對比、字寬不勻。中英混排一行看不出來，整頁英文就是「哪裡不對
   但說不出」。

   只在 lang="en" 下生效。這個站的語言是運行時切的（?lang=en 之後
   把 documentElement.lang 設成 en），所以選擇器寫在 html 上就夠。 */
html[lang="en"]{
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --read:"Source Serif 4",Charter,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* 標題：站名和卡片名 */
html[lang="en"] .logo b,
html[lang="en"] .cbody h3,

html[lang="en"] h2{font-family:var(--serif);letter-spacing:-.02em}

html[lang="en"] .rev,
html[lang="en"] .judge .v,
html[lang="en"] .slogan{font-family:var(--read)}
</style></head>

/* ------------------------------------------------------------------
   1 · 封面判斷
   ------------------------------------------------------------------
   **不再信 covers.json 的 is_real_artwork。** 內容把 154 張逐張打開看過，
   那個字段 25% 是硬假陽性：二維碼、過期微信群碼、純字標、60px 頭像放大、
   Kimi 贊助廣告、灰底一個播放三角的空白圖，還有 36 件商品擠在 13 張圖上。
   根因是 existing 那一檔等於假設舊數據是對的，沒有人打開看過。

   現在的真源是 editorial/curation.json 的三個字段（內容寫的，人看過的）：
     cover_kind = artwork | hero | diagram | other | og
     cover_real = true 只給 artwork，且**去重後**才算
     cover_dup_of = 撤掉的重複圖指向留下的那件

   在架 152 件的實際分布：
     **產出物圖 27 件 = 18%**
     作者自制頭圖 21 · 機制示意圖 8 · 其他 2  → 有任何真圖 58 件 = 38%
     其餘 94 件無圖（logo / 空白圖 / OG 卡已在數據層撤掉）

   ▸ **所以「圖片主導」這個前提按產出物算是不成立的。** 版式必須讓無圖卡
     當一等公民 —— 見 .card.noimg 那幾節。
   ------------------------------------------------------------------ */
/* ---- 封面兜底黑名單 --------------------------------------------
   **這塊是我在刪 covers.json 那次重構裡連帶刪掉的，屬於我的疏漏。**
   後果是真實的：`hugohe3-ppt-master` 的 cover 是
   `gcdn.moonshot.cn/growth-cdn/sponsor/kimi-en.png` —— 一張 **Kimi 贊助商廣告**，
   而它在數據裡標著 `cover_kind: artwork` + `cover_real: true`，
   於是詳情頁圖注會寫「作者倉庫裡的產出示例——這就是它做出來的東西」。
   一張第三方廣告被印成我們的產出物證據，正是產品最怕的那個失敗模式。

   兩條規則，兩種性質：

   甲 `gcdn.moonshot.cn` 等贊助/徽標/頭像/二維碼 —— 數據層該清掉，這裡只是兜底。
      清掉之後這些詞留著不礙事，多一層保險。

   乙 `img.youtube.com` / `i.ytimg.com` —— **這條是隱私判斷，不是審美判斷。**
      `alchaincyf-huashu-design` 熱鏈 YouTube 縮略圖，是上站 55 張裡
      **唯一一個第三方圖片請求**：每個訪客的瀏覽器都會去 ping 一次 Google。
      其餘 54 張全在作者自己的倉庫上（raw.githubusercontent / repository-images）。
      一個賣信任的站，不該為一張縮略圖讓所有讀者被第三方看一眼。
      代價是少一張圖，值。

   兩件都已報給內容，正解是數據層換圖或置空 `cover`。
   ---------------------------------------------------------------- */
var COVER_DENY = /opengraph\.githubassets\.com|private-user-images\.githubusercontent\.com|buymeacoffee|hackingwithswift|shields\.io|badge|images\.weserv\.nl|gcdn\.moonshot\.cn|qr[-_]?code|[-_\/]qr[-_.]|reward[-_]qr|wechat[-_]group|weixin[-_]?(qr|group)|donate|img\.youtube\.com|i\.ytimg\.com/i;

function coverRec(it){
  if(!it) return null;
  var u = (it.cover||"").trim();
  // cover 為空就什麼都不渲染。兩種情況都落在這裡：
  //   · cover_kind==="og"      —— OG 卡不上站
  //   · kind==="artwork" 但 cover 空 —— 圖是真的，但和 cover_dup_of 那件重複，被撤下了
  //     （12 件是這種。**不要據此渲染任何東西**，別自作聰明去找那張原圖。）
  if(!u) return null;
  if(COVER_DENY.test(u)) return null;   // 兜底：贊助廣告 / 徽標 / 二維碼 / 第三方熱鏈
  return {
    url:  u,
    // cover_real 只描述**實際展示的那張圖**：真產出物圖且沒被去重撤下，才是 true。
    real: it.cover_real===true,
    kind: it.cover_kind || "",
    w:    it.cover_w || 0,
    h:    it.cover_h || 0
  };
}
function coverOf(it){ var r=coverRec(it); return r ? r.url : ""; }

/* 封面只引 800px 寬的 WebP 派生圖（scouts/make_thumbs.py 生成）。
   原圖中位 1200 寬、平均 788 KB，最大接近 4 MB，而卡片在手機上顯示 177×122、
   詳情頁 350×242——首頁一次要下 9.4 MB，首屏卡片是一排灰框。派生圖合計 4.1 MB
   之於原圖 54.2 MB（8%）。
   派生圖缺失就回退原圖，回退也失敗才撤掉這張圖，所以這條路上任何一環壞了都不開天窗。 */
function thumbURL(u){
  var m = /^(\/skill\/assets\/covers\/)([^\/]+)\.[A-Za-z0-9]+$/.exec(u||"");
  return m ? m[1] + "w800/" + m[2] + ".webp" : u;
}
function coverFail(img){
  var full = img.getAttribute("data-full");
  if(full && img.getAttribute("src") !== full){   // 派生圖沒有 → 用原圖
    img.removeAttribute("data-full");
    img.setAttribute("src", full);
    return;
  }
  var s = img.parentNode, c = s && s.parentNode;
  if(s) s.remove();
  if(c) c.classList.add("noimg");
}

var params = new URLSearchParams(location.search);
var lang = params.get("lang")==="en" ? "en" : "zh";
var t = function(k){ var v=I18N[lang][k]; return v==null?k:v; };

var state={ q:"", cat:"all", limit:60 };
/* 09-03 同事 humanworld-a4 實測：篩了分類、翻了一屏、點開一件再返回 → 分類回「全部」、滾到頂。
   state 只活在內存，任何導航都清零；卡片是 JS 渲染的，瀏覽器自帶的滾動恢復也落空。
   改法：cat / q 進 URL（?cat=…&q=…，返回天然帶回，還能分享篩選後的貨架）；
   已加載的條數和滾動位置存 sessionStorage（按 URL 分鍵），首次渲染後恢復。 */
if(params.get("cat")) state.cat = params.get("cat");
if(params.get("q"))   state.q   = params.get("q");
try{ history.scrollRestoration = "manual"; }catch(_){}
function syncURL(){
  var u = new URLSearchParams();
  if(lang==="en") u.set("lang","en");
  if(state.cat!=="all") u.set("cat", state.cat);
  if(state.q) u.set("q", state.q);
  var qs = u.toString();
  var next = location.pathname + (qs ? "?"+qs : "") + location.hash;
  if(next !== location.pathname+location.search+location.hash) history.replaceState(null, "", next);
}
function posKey(){ return "pinwei:pos:"+location.search; }
function savePos(){
  var y = window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
  try{ sessionStorage.setItem(posKey(), JSON.stringify({y:y, limit:state.limit})); }catch(_){}
}
function restorePos(){
  var raw=null; try{ raw = sessionStorage.getItem(posKey()); }catch(_){}
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(_){ return null; }
}
window.addEventListener("pagehide", savePos);
// iOS Safari 上 pagehide 有時不觸發，頁面轉後臺時也存一次
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") savePos(); });

function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function sprintf(s,v){return String(s).replace("%s",v)}

var CJK = "\\u2e80-\\u2fff\\u3040-\\u30ff\\u3400-\\u4dbf\\u4e00-\\u9fff\\uf900-\\ufaff\\uff00-\\uffef";
var GAP_A = new RegExp("(["+CJK+"])([A-Za-z0-9@#$%&+=/\\\\])","g");
var GAP_B = new RegExp("([A-Za-z0-9!?.,:;%)\\]}+=/\\\\])(["+CJK+"])","g");
/* 中西文之間插一個薄間距 <i class="g">。做法是先插哨兵、轉義 HTML、再把哨兵換成標籤 ——
   順序不能反，否則哨兵本身會被 esc() 轉義掉。

   哨兵原來寫的是**裸 NUL 字節**。JS 裡跑得通，代價是整個 index.html 對 file(1) 是
   "data" 而不是 HTML，grep 當二進制處理、一行都不輸出（連 `grep -c .` 都是空的），
   而且任何做文本規範化的工具都可能把它吃掉。改成 \uE000（Unicode 私用區，正文裡
   不可能出現）並且用**轉義序列**寫，文件從此是純文本。 */
var GAPMARK = "\uE000";
function mix(s){
  var x = String(s==null?"":s).replace(GAP_A,"$1"+GAPMARK+"$2").replace(GAP_B,"$1"+GAPMARK+"$2");
  return esc(x).split(GAPMARK).join('<i class="g"></i>');
}

function clean(s){ return String(s==null?"":s).replace(/^\s*>\s*/,"").trim(); }
/* 英文標題優先用人寫的 title_en；沒有才回落到 skill 名 ——
   回落到 name 會在英文版印出 city-salary / codex-ppt 這種倉庫標識符，
   那不是標題，是文件名。 */
function nameOf(it){ return lang==="zh" ? (it.title_zh||it.name)
                                        : (clean(it.title_en) || it.name || it.title_zh); }
function tagOf(it){
  var s = lang==="zh" ? clean(it.tagline_zh) : (clean(it.tagline_en) || clean(it.tagline_zh));
  if(!s || /英文簡介|見下/.test(s)) s = clean(it.why_zh) || s;
  return s;
}
function whyOf(it){ return lang==="zh" ? clean(it.why_zh) : (clean(it.why_en) || clean(it.why_zh)); }
/* 英文版裡，點評只有中文的那些要掛個「中文」標 —— 不然英文讀者以為頁面壞了 */
function isZhOnly(it){ return lang==="en" && !clean(it.why_en) && !!clean(it.why_zh); }
function zhChip(it){ return isZhOnly(it) ? '<span class="zhchip">'+esc(t("zhOnly"))+'</span>' : ""; }
/* 「但是」只認真數據。讀不到就沒有這一句 —— 空著是誠實。 */
function limitOf(it){ return lang==="zh" ? clean(it.limit_zh) : (clean(it.limit_en) || clean(it.limit_zh)); }

/* 流裡那一句「但是」：有 limit_brief_zh 就用它（≤30 字、完整句），
   沒有就把 limit_zh 原樣交給 CSS 夾行 —— **絕不自己截字符串**。

   我原來實現的是「在 46 字內最後一個句讀處斷開」，看著體面：切出來是個完整句子。
   開發反對得對，而且用的是我自己那條論證 —— 我反對過「把 107 字的誠實短處砍成
   前 24 字」，因為那讓誠實讀起來像鉤子。**在句讀處切得乾淨只是讓這件事更難被發現。**
   構建期有一條 ERROR 專查這種「偽裝成完整句的截斷」，前端截出來的正是那個形狀。

   CSS 夾行不一樣：它留一個省略號，如實說「這句話沒說完」，而完整版在一次點擊之外
   且一刀不動 —— 就是 docs/PROTOCOL.md 那條規矩。 */
function limitBrief(it){
  var s = lang==="zh"
    ? clean(it.limit_brief_zh)
    : clean(it.limit_brief_en || it.limit_brief_zh);
  if(s) return {text:s, cut:false};
  var full = limitOf(it);
  if(!full) return null;
  return {text:full, cut:true};      // 交給 .but .tx 的 line-clamp，省略號是誠實的
}

function renderChips(all){
  var h = '<button class="chip'+(state.cat==="all"?" on":"")+'" data-cat="all">'
        + esc(t("all"))+'<i class="cnt">'+all.length+'</i></button>';
  var nh = hearts().length;
  /* 0 件時通常不出這個膠囊 —— 沒標過東西的人不需要看見它。
     **但正站在心選裡的時候必須留著**：取消最後一個心標之後它一消失，
     膠囊行就沒有任何一個是選中的，而貨架是空的，人不知道自己在哪兒、
     也沒有一個明顯的出口。留著它（計數 0）就是那個出口。 */
  if(nh || state.cat==="heart")
    h += '<button class="chip heartchip'+(state.cat==="heart"?" on":"")+'" data-cat="heart">'
       + '♥ '+esc(t("mine"))+'<i class="cnt">'+nh+'</i></button>';
  var np = all.filter(function(x){return x.pick}).length;
  if(np) h += '<button class="chip'+(state.cat==="pick"?" on":"")+'" data-cat="pick">'
            + esc(t("pick"))+'<i class="cnt">'+np+'</i></button>';
  (D.categories||[]).forEach(function(c){
    if(!c.count) return;
    h += '<button class="chip'+(state.cat===c.id?" on":"")+'" data-cat="'+esc(c.id)+'">'
       + esc(lang==="zh"?c.zh:c.en)+'<i class="cnt">'+c.count+'</i></button>';
  });
  el("chips").innerHTML = h;
}

   槽位次序固定：圖（或墨槓）→ 標題 → 點評 → 但是 → 徽章。
   有圖無圖**不換次序、不補佔位**，所以兩種卡的節拍是同一個。

/* ---- 畫幅：證據給大畫幅，宣傳圖不給 ----------------------------
   帶寬比在流裡收窄，詳情裡按原樣不裁。為什麼要收：實測原始寬高比
   0.46 – 4.69，一張 2560×608 的橫幅放進 261px 寬的卡里只有 **59px 高**，
   那讀起來像渲染故障不像一張圖。橫幅通常居中構圖，裁到 2:1 留得住有意義的那塊。

   **兩檔不一樣，這是刻意的：**
     產出物圖（cover_real）  [0.6, 2.0] —— 豎幅可以很高，佔得住注意力
     作者頭圖 / 示意圖        [1.0, 2.0] —— 不給豎幅、不給大畫幅
   瀑布流裡高卡就是注意力。注意力給證據，不給宣傳圖。
   不額外印「作者頭圖」這種標籤 —— 31 張卡上加一行小字是噪音，
   畫幅本身已經把話說清了。 */
function plateGlyph(it){
  // 標題裡第一個漢字當大字；沒有漢字就用分類名的首字
  var t = nameOf(it) || "", m = t.match(/[\u4e00-\u9fff]/);
  if(!m){ var c = catName(it.category) || "技"; m = [c.charAt(0)]; }
  return m[0];
}
function shotHTML(it, forSheet){
  var rec = coverRec(it);
  if(!rec){
    // 09-03：89 件在作者倉裡確實找不到自家的圖（README 和文件樹都翻過）。
    // 與其讓它們當純文字塊夾在有圖的卡中間，不如給一張排版底 —— 大字襯線首字 + 分類小字，
    // 照原聲 .cover .fallback 的路子。比例 2:1，別把一列吃掉。詳情頁（forSheet）不需要。
    // 店主 09-03：「詳情頁把封面圖也放進去，如果有的話，沒有的話就放 github url 預覽卡」。
    // 卡片上不鋪預覽卡（毫無吸引力、有大有小），詳情頁一次只看一件，放預覽卡是給讀者一個倉的門臉。
    if(forSheet){
      if(!it.repo) return "";
      return '<span class="shot hasimg sheet-og" style="aspect-ratio:2">'
           + '<img src="https://opengraph.githubassets.com/pinwei/'+esc(it.repo)+'" alt="" loading="eager" decoding="async"'
           + ' onerror="this.parentNode.remove()"></span>';
    }
    return '<span class="shot plate-only" aria-hidden="true">'
         + '<span class="plate-glyph">'+esc(plateGlyph(it))+'</span>'
         + '<span class="plate-kicker">'+esc(catName(it.category))+'</span></span>';
  }
  var ar = (rec.w && rec.h) ? rec.w/rec.h : 0;

  /* ================================================================
     卡上畫幅：一條規則，兩個常量，零 `cover_kind` 分叉。

     ---- 為什麼要換掉上一版 ----
     上一版是四個旋鈕、其中三個按 kind 分叉：
       AR_ART=[0.45,2.00] · AR_HERO=[1.00,2.00] · NO_CARD_AR=2.5 · tallcap / tallcap-art
     它讀起來像「一張一張特批」，因為它本來就是查找表不是原則 ——
     而分叉全都掛在 `cover_kind` 上，也就是把畫幅決定掛在了**選品判斷**上。

     ---- 一條規則 ----
     卡上的圖只需要回答兩個問題，兩個都只跟**渲染出來多大**有關，跟它是誰畫的無關：

       甲 上不上卡？   圖太扁 → 卡上是一條縫，什麼都讀不出來 → 不上，交給詳情頁
       乙 多高？       圖太豎 → 一張圖吃掉一整列 → 限高

     所以：**卡上永不裁，只決定「上不上」和「多高」。**

     不裁這一條是關鍵。裁需要知道「信息是不是沿某一軸分布」（橫幅裁兩側無妨，
     四格敘事裁掉一格就毀了落點）—— 而數據裡**沒有這個字段**，永遠也不會有。
     上一版靠 `cover_kind` 當代理，那是拿「誰畫的」猜「信息怎麼分布」，兩件事不相干：
     `deusyu-translate-book` 是 diagram、比 0.75，上一版按 AR_HERO 下限 1.00 **裁掉 25%** ——
     裁掉的是示意圖的四分之一，比裁一張橫幅的兩側嚴重得多。

     ---- 兩個常量怎麼來的 ----
     AR_FLAT = 2.45：卡上的圖高不得低於寬的 1/2.45（手機 171px 寬 → 70px 高）。
       低於這個就是一條縫：那張四格敘事比 3.00，每格只有 42.6×56.8px，
       而詳情頁給它 84.8×113px —— **4 倍面積**，所以交給詳情頁是淨賺。
     H_MAX_K = 1.40：高不得超過寬的 1.40 倍（原為 2.25，2026-09-02 按 177 張複驗後收窄，見下）。
       現存最豎的是比 0.45（1264×2780），高 = 2.22 倍寬 —— **剛好在下面，所以這條今天不觸發**，
       它是給將來更極端的圖留的閘。另加一道 78vh，防的是窄短視口下一張圖佔滿屏，
       跟寬度那道閘管的不是同一件事。

     ---- 實測：換規則的代價 ----
     56 張封面逐張跑過兩套規則，手機 171px 和桌面 261px 都跑了：
       **上卡張數 50 → 50（同一批圖）· 被裁張數 4 → 0**
     只有 4 張結論不同，全是「原來裁、現在不裁」：
       othmanadi-planning-with-files  比2.33 hero     裁14% → 0%，框 86→73px
       virgiliojr94-book-to-skill     比2.33 hero     裁14% → 0%，框 86→73px
       312362115-claude-diagram       比2.24 diagram  裁11% → 0%，框 76px
       deusyu-translate-book          比0.75 diagram  裁25% → 0%，框 171→228px
     代價是前三張的框矮了 10–13px，換來零裁切和零分叉。
     ---- 2026-09-02 複驗：分布變了，常量沒跟上 ----
     上面那句「現存最豎的是比 0.45、高 2.22 倍寬，剛好在下面，所以這條今天不觸發」
     是 **56 張封面時**的事實。現在有寬高的是 177 張，同樣那張比 0.45 撐出 **895px**，
     而框高中位數是 204px —— **最高/中位 = 4.4 倍**。一張卡三四倍於鄰居，
     瀑布流看著就是一根柱子加一片空洞（圖沒加載完時尤其明顯）。
     **常量沒錯，是分布變了而沒人回來複驗。**

     按 177 張重算（桌面列寬 407px 實測）：
       2.25×（原）  最高 895px · 4.4×中位 · 受影響 0 張
       1.60×        最高 651px · 3.2×中位 · 受影響 5 張
       1.40×（取）  最高 570px · 2.8×中位 · 受影響 9 張
       1.25×        最高 509px · 2.5×中位 · 受影響 17 張
     取 1.40：把最壞情況從 4.4 倍壓到 2.8 倍，只動 9 張。

     被限住的那幾張改用 cover + 頂部對齊（.shot.capped）：
     contain 會在底部留一條空帶 —— 那正是「空洞」本身，等於用一個空洞換另一個。
     頂部對齊意味著裁掉的是**底部**，海報的頭還在。這是對「不裁切」那條的**收窄**，
     不是推翻：只對超出 1.40 倍的極端豎幅生效，且只裁底。
     ================================================================ */
  /* ---- 卡片上不用 GitHub 默認預覽卡（cover_kind==="og"）----
     2026-09-02 量的：在架 181 件裡 **88 件（49%）** 的封面是 GitHub 自動生成的
     社交預覽卡 —— 1200×600，把 owner/repo 印成大字，配 Star/Fork 數和章魚貓 logo。
     它在瀑布流裡滿幅鋪開，**看起來像一個英文標題而不是一張封面**，
     和這個店的米色襯線版式搶同一個位置。截圖裡那張
     「op7418/Youtube-clipper-skill」不是標題，就是這麼來的。

     站點本來就為「沒有圖」設計過版式：.plate-ink（米色漸變 + 分類小字 + 襯線標題）。
     **那不是空洞，是這個店自己的語言。** 所以 og 這一檔在卡片上走 plate，
     不鋪 GitHub 那張圖。

     這一條**覆蓋了店主 2026-08-31 說的「沒有倉庫圖就用默認預覽卡」**——
     那句話是為了「別讓卡片開天窗」，而 plate 同樣不開天窗，且不引入外站的字體和
     logo。詳情頁（forSheet）仍然給圖，那裡一次只看一件，不存在互相搶的問題。
     ---------------------------------------------------------------- */
  // 09-03 撤回上面那條：店主說「很多都沒圖片」—— 他 08-31 的指示是「沒有倉庫圖就用默認預覽卡」，
  // 我 09-02 擅自改成不鋪。恢復鋪，但用 .shot.og 壓對比、去飽和、縮一圈，別和真封面搶。
  // 09-03 第三次改這條，這次聽最新的話：店主說預覽卡「毫無吸引力，有大有小」（1200×600 和 1200×630 混著）。
  // 卡片上不鋪預覽卡；取不到作者倉裡的真圖（repo_covers.py）就走 plate。
  if(!forSheet && it.cover_kind === "og") return "";
  var ogCls = "";

  var AR_FLAT = 2.45, H_MAX_K = 1.40;
  var rawAr = ar;
  if(!forSheet){
    if(ar >= AR_FLAT) return "";
    if(ar && ar < 1/H_MAX_K) ar = 1/H_MAX_K;        // 乙 · 太豎 → 限高（等比，不裁）
  }
  // 寬高比已知就寫死 —— 圖片加載前空間就佔好了，瀑布流不跳版
  var sty = ar ? ' style="aspect-ratio:'+(Math.round(ar*1000)/1000)+'"' : '';
  // 78vh 那道閘和上面的寬度閘管的不是一件事：它防的是窄短視口下一張圖佔滿屏
  var tall = (!forSheet && ar && ar < 0.78) ? " tallcap" : "";
  // 被 H_MAX_K 限住的（原圖比這個還豎）→ cover 頂部對齊，別在底部留空帶
  if(!forSheet && rawAr && rawAr < 1/H_MAX_K) tall += " capped";
  return '<span class="shot hasimg'+tall+ogCls+'"'+sty+'>'
       +   (isPack(it)&&!forSheet ? '<span class="packtag">'+esc(sprintf(t("pack"), it.skill_count||"?"))+'</span>' : '')
       +   '<img src="'+esc(thumbURL(rec.url))+'" data-full="'+esc(rec.url)+'" alt="" loading="'+(forSheet?"eager":"lazy")+'" decoding="async"'
       +     ' onerror="coverFail(this)">'
       + '</span>';
}

/* 心選：只落 localStorage。站是靜態的，沒有後端，也不該有 ——
   點心不產生任何網絡請求，讀者的偏好不出他自己的瀏覽器。 */
var HK = "pinwei.hearts";
function hearts(){
  try { return JSON.parse(localStorage.getItem(HK) || "[]"); } catch(e){ return []; }
}
function isHeart(id){ return hearts().indexOf(id) >= 0; }
function toggleHeart(id){
  var a = hearts(), i = a.indexOf(id);
  if(i >= 0) a.splice(i,1); else a.push(id);
  try { localStorage.setItem(HK, JSON.stringify(a)); } catch(e){}
  return i < 0;
}
var HEART_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true">'
  + '<path d="M8 14S1.5 9.9 1.5 5.6A3.6 3.6 0 0 1 8 3.5a3.6 3.6 0 0 1 6.5 2.1C14.5 9.9 8 14 8 14Z" '
  + 'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
function heartHTML(it){
  var on = isHeart(it.id);
  return '<button class="heart" type="button" data-heart="'+esc(it.id)+'" aria-pressed="'+on+'" '
       + 'title="'+esc(t(on?"hearted":"heart"))+'" aria-label="'+esc(t(on?"hearted":"heart"))+'">'
       + HEART_SVG + '</button>';
}

function badgesHTML(it, isNew){
  var h = '<span class="tagn">'+esc(catName(it.category))+'</span>';
  if(isNew) h += '<span class="newdot">'+esc(t("newBadge"))+'</span>';

function butHTML(it){
  var b = limitBrief(it);

              + '<span class="tx">'+esc(t("butNone"))+'</span></div>';

function cardHTML(it, isNew){
  var shot = shotHTML(it);
  var why  = whyOf(it);
  // 墨槓總是出現在 DOM 裡，由 CSS 決定顯不顯 —— 這樣圖片 onerror 退化成無圖卡時，
  // 起頭那道槓也在，不會退成一張沒頭的卡。
  return '<a class="card" href="'+itemPath(it)+'" data-id="'+esc(it.id)+'">'
    + shot
    + '<div class="cbody">'
    +   '<h3>'+mix(nameOf(it))+'</h3>'

    +   badgesHTML(it, isNew)
    + '</div>'
    + '</a>';
}

/* ------------------------------------------------------------------
   6 · 流
   ------------------------------------------------------------------ */
function filterList(all){
  var q = state.q.trim().toLowerCase();
  return all.filter(function(it){
    if(state.cat==="heart"){ if(!isHeart(it.id)) return false; }
    else if(state.cat==="pick"){ if(!it.pick) return false; }
    else if(state.cat!=="all" && it.category!==state.cat) return false;
    if(!q) return true;
    return [it.name,it.title_zh,it.tagline_zh,it.tagline_en,it.why_zh,it.why_en,it.repo,it.owner]
      .join(" ").toLowerCase().indexOf(q) >= 0;
  });
}

function renderFlow(all){
  var list = filterList(all), q = state.q.trim();
  var newest = (D.generated_at||"").slice(0,10);

  // 瀑布流沒法按天分組（多列會把日期打散），所以「今天挑了什麼」提到流上面說一句。
  // 0 件就照實說 0 件，不硬湊。
  var head = "";
  if(!q && state.cat==="all"){
    var n = D.new_today||0;
    head = '<div class="todayline"><span class="dot"></span>'
         + (n ? t("today").replace("%s", n) : esc(t("todayNone")))
         + '</div>';
  } else if(q){
    head = '<div class="todayline"><span class="dot"></span>'
         + esc(sprintf(t("results"), list.length))+'</div>';
  } else if(state.cat==="heart" && list.length){
    /* 心選是店主的手動信號，凌駕於機器信號之上。這裡給一個一次性彙總的出口：
       點心只寫 localStorage，攢夠了在這兒開一個預填的 Issue 交上來。 */
    head = '<div class="sendbar"><span>'+esc(sprintf(t("sendTip"), list.length))+'</span>'
         + '<button id="sendHearts" type="button">'+esc(t("send"))+'</button></div>';
  }

  /* 空態分兩種，說的不是一件事。
     心選被清空時 head 是空串、搜索框也是空的 —— 這時候印「換個詞試試」，
     是在讓人去改一個他根本沒打過的詞。取消最後一個心標就會走到這兒。 */
  if(!list.length){
    var msg = (!q && state.cat==="heart") ? t("emptyHeart") : t("empty");
    return head + '<div class="empty">'+esc(msg)+'</div>';
  }

  var shown = list.slice(0, state.limit);
  var flow = '<div class="flow">'
    + shown.map(function(it){ return cardHTML(it, it.added_at===newest) }).join("")
    + '</div>';

  var rest = list.length - shown.length;
  flow += rest>0
    ? '<button class="more" id="more" type="button">'+esc(sprintf(t("moreN"), rest))+'</button>'
    : '<div class="empty" style="padding:var(--s5) 0;font-size:var(--t-meta)">'+esc(t("noMore"))+'</div>';

  return head + flow;
}

/* 貨架條目 —— **只有這一個地方決定「有哪些、什麼順序」**。
   順序不在這裡算，就是 feed 給的順序（見上面 renderShelf 裡的註釋）。
   原來這一段在兩處各寫了一遍，兩份都在重排 —— 重複的邏輯遲早會分叉，
   而分叉的那天沒人會想起來去看另一處。 */
function shelfItems(){
  return (D && D.skills || []).filter(function(x){ return !x.hide; });
}

/* 下拉到底自動加載（店主：「下拉分頁加載，不要每次加載全部」）。
   原來是點「再看 N 件」按鈕；現在按鈕進視口就自動觸發，按鈕本身保留當兜底（觀察器不可用時還能點）。
   數據仍是一次取整份 feed（190 件的 JSON 很小），重的是 DOM 和圖，所以分批渲染即可。 */
var _moreIO = null, _moreBusy = false;
function _nearMore(){
  var btn = document.getElementById("more");
  if(!btn || _moreBusy) return;
  var top = btn.getBoundingClientRect().top;
  if(top < innerHeight + 600){ _moreBusy = true; btn.click(); setTimeout(function(){ _moreBusy = false; }, 200); }
}
function armAutoMore(){
  var btn = document.getElementById("more");
  if(!btn) return;
  // 兩條路都掛：IntersectionObserver 為主；scroll 事件兜底。
  // 2026-09-03 在嵌入式瀏覽器面板裡實測：按鈕明明在視口內（top 658 < 900），
  // 新建的 IntersectionObserver 800ms 內不觸發 —— 後臺/隱藏標籤頁裡 IO 回調會被節流。
  // 真實瀏覽器裡 IO 沒問題，但不能只靠它；scroll 兜底一行的成本，換一個不會靜默失效的功能。
  if("IntersectionObserver" in window){
    if(_moreIO) _moreIO.disconnect();
    _moreIO = new IntersectionObserver(function(es){
      if(es.some(function(e){ return e.isIntersecting })){ _moreIO.disconnect(); _nearMore(); }
    }, {rootMargin:"600px 0px"});
    _moreIO.observe(btn);
  }
  _nearMore();                                  // 首屏就夠到按鈕的情況（短列表/大屏）
}
addEventListener("scroll", _nearMore, {passive:true});

function renderShelf(keepScroll){
  if(!D) return;
  var y = keepScroll ? window.scrollY : null;
  renderChrome();
  renderTally();
  // **不在前端重排。** feed 裡的順序就是貨架順序 —— 那是 scout_lib.refresh() 算的：
  // 收錄日倒序（「今天挑了什麼」是這一頁的主語）→ 同一天內真產出物圖優先 → fun_score → id。
  //
  // 原來這裡按 `added_at` 倒序、再按 `title_zh` 字母序**整個重排一遍**，
  // 於是流水線裡那兩檔（真產出物優先、去掉 star）**一件都沒生效** ——
  // 我改完排序刷新頁面，看到的還是原樣，一開始以為是瀏覽器緩存。
  // 兩份排序真相，贏的是前端那份，而寫在流水線註釋裡的是另一份。
  // 同一個形狀今天已經出現三次（拒收榜去重鍵、從不執行的守衛、這裡）：
  // **寫下來那一刻，和真的生效，之間沒有任何自動連線。**
  var all = shelfItems();
  renderChips(all);
  el("main").innerHTML = renderFlow(all);
  armAutoMore();
  syncURL();
  SHELF = true;
  if(y!=null) window.scrollTo(0,y);
}

/* ------------------------------------------------------------------
   7 · 詳情
   ------------------------------------------------------------------ */
function sheetHTML(it){
  var ins = it.install||{};
  var why = whyOf(it), lim = limitOf(it), tg = tagOf(it);

  var h = '<button class="x" type="button" aria-label="close">✕</button>'
    + '<h3>'+mix(nameOf(it))+'</h3>'
    + '<div class="repo"><a href="'+esc(urlOf(it))+'" target="_blank" rel="noopener">'
    +   esc(it.repo)+(it.path?" / "+esc(it.path):"")+'</a>'
    // 日期只在 age_source 是 file / repo 時寫。空串意味著手上只有倉庫年齡，
    // 而這件長在子目錄裡 —— 倉庫年齡不是它的年齡，那就一個字都不寫。現在 148/150 是空串。
    +   (dateOK(it) ? ' · '+esc(t("added"))+' '+esc(fmtDate(it.added_at)) : '')
    +   (isPack(it) ? ' · '+esc(sprintf(t("pack"), it.skill_count||"?")) : '')
    + '</div>'
    + shotHTML(it, true)
    + shotCapHTML(it)
    + coverNoteHTML(it)
    + (tg ? '<p class="lead">'+mix(tg)+'</p>' : '');

  /* 「備料齊」憑什麼 —— 徽章只說結論，詳情頁把證據攤開。
     **只在 prep_badge === "ready" 時出現。沒有第二檔，沒有負向檔。**
     不要去數 prep_evidence 的條數：「1–2 條」「0 條」「根本沒有正文存檔」
     三種情況在 feed 裡字節完全一致（"" + []），前端**拿不到**能渲染成負面的信息。
     那是刻意設計的 —— 缺存檔的 16 件是我們自己 path 記錯的欠賬，不是商品的問題。 */
  if(it.prep_badge === "ready" && (it.prep_evidence||[]).length){
    h += '<p class="prepwhy">'+esc(t("prepWhy"))
       + it.prep_evidence.map(function(e){ return '<span>'+esc(e)+'</span>' }).join('')
       + '</p>';
  }

  // 判斷塊：豎線屬於「點評」。「但是」缺席時整塊照樣閉合，不留空槽。
  if(why || lim){
    /* 點評和但是是**平行的兩條**，同字號同墨色同標籤樣式 ——
       它們是一件事的兩面，不該一條重一條輕。 */
    h += '<div class="judge">'
       + (why ? '<span class="lb">'+esc(t("verdict"))+'</span>'
              + '<p class="v">'+zhChip(it)+mix(why)+'</p>' : '')
       + (lim ? '<span class="lb lb2">'+esc(t("butFull"))+'</span>'
              + '<p class="b">'+mix(lim)+'</p>' : '')
       + '</div>';
  }

  h += '<h4>'+esc(isPack(it) ? t("collectStep") : t("install"))+'</h4>';
  if(isPack(it)){
    /* 合集沒有「裝它」這個動作。三件事都按 feed 走，不在前端硬寫：
         install.copy 是空串 —— **正常的**（D7），不要顯示覆制按鈕
         install.note —— 那句定死的文案在數據裡，前端不再自己存一份
         install.browse —— 指向真正裝著 skill 的那個子目錄
       前端存一份文案會和數據漂移；文案改了得改兩處，必漏一處。 */
    if(ins.clone) h += cmdHTML(ins.clone);
    var note = (ins.note||"").trim() || t("collectNote");
    h += '<div class="packnote">'+esc(note).replace(/`([^`]+)`/g,"<code>$1</code>")
       +   (ins.browse ? ' <a href="'+esc(ins.browse)+'" target="_blank" rel="noopener">'
                       + esc(t("browseDir"))+'</a>' : '')
       + '</div>';
  } else {
    if(ins.clone || ins.copy){
      h += '<div class="step">1 · '+esc(t("step1"))+'</div>';
      if(ins.clone) h += cmdHTML(ins.clone);
      if(ins.copy)  h += cmdHTML(ins.copy);
    }
    h += '<div class="step">2 · '+esc(t("step2"))+'</div>';
  }
  h += '<div class="safety">'+esc(t("safety"))+'</div>';
  return h;
}
/* 圖注只出現在詳情頁。五檔各說清楚這張圖是什麼，非產出物的明寫「不是產出示例」。
   `ours` = 我們自己裝上真跑出來截的圖 —— 護城河就在這一檔，所以它的圖注
   是唯一一句**正面**的話，而且墨色比其他檔重一級（.shotcap.ours）。
   映射查不到的 kind 一律按「不是產出示例」兜底，寧可說輕不說重。 */
var CAP_KEY = {artwork:"capArtwork", ours:"capOurs", hero:"capHero", diagram:"capDiagram", other:"capOther"};
function shotCapHTML(it){
  var rec = coverRec(it);
  if(!rec) return "";
  var k = CAP_KEY[rec.kind] || (rec.real ? "capArtwork" : "capOther");
  var cls = "shotcap" + (rec.real ? " real" : "") + (rec.kind==="ours" ? " ours" : "");
  return '<p class="'+cls+'">'+t(k)+'</p>';
}
/* `ours` 那一檔的復現憑據。**這是補一個洞，不是加裝飾。**
   `cover_note` 裡記著我們跑的命令（任務書原話：「沒有命令的 ours 是不可復現的
   證據聲明」），但它原來只活在數據裡 —— 於是 `ours` 成了全站**最強的聲明**
   配**最弱的可核性**：`artwork` 至少圖在作者倉庫裡，讀者點進去能自己看；
   `ours` 說「我們跑的」，讀者卻沒有任何東西可查。
   一個查不了的證據聲明，就是這個項目一直在防的那種「誠實變成營銷」。

   只給 `ours` 渲染。`cover_note` 裡的反引號轉成 <code>，其餘按純文本轉義 ——
   這段文字是人寫的，不能當 HTML 灌。 */
function coverNoteHTML(it){
  var rec = coverRec(it);
  if(!rec || rec.kind !== "ours") return "";
  var note = (it.cover_note || "").trim();
  if(!note) return "";
  var html = esc(note).replace(/`([^`]+)`/g, '<code>$1</code>');
  return '<p class="covernote">'+html+'</p>';
}
function cmdHTML(c){
  return '<div class="cmd">'+esc(c)+'<button type="button" data-c="'+esc(c)+'">'+esc(t("copy"))+'</button></div>';
}

var lastFocus=null;
function openSheet(it){
  lastFocus = document.activeElement;
  el("sheet").innerHTML = sheetHTML(it);
  el("veil").classList.add("open");
  document.body.style.overflow = "hidden";
  var x = el("sheet").querySelector(".x"); if(x) x.focus();
}
function closeSheet(){
  el("veil").classList.remove("open");
  el("sheet").innerHTML = "";
  document.body.style.overflow = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}

function copyText(txt, btn){
  var old = btn.textContent;
  function done(){ btn.textContent = t("copied"); setTimeout(function(){btn.textContent=old},1400); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else fallback();
  function fallback(){
    var ta=document.createElement("textarea"); ta.value=txt;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){}
    document.body.removeChild(ta);
  }
}

/* ------------------------------------------------------------------
   8 · 交互
   ------------------------------------------------------------------ */
document.addEventListener("click", function(e){
  var cp = e.target.closest(".cmd button");
  if(cp){ e.stopPropagation(); copyText(cp.getAttribute("data-c"), cp); return; }

  if(e.target.closest(".sheet .x")){ closeSheet(); return; }
  if(e.target.id==="veil"){ closeSheet(); return; }

  var sh = e.target.closest("[data-share], #shareSite");
  if(sh){
    e.stopPropagation(); e.preventDefault();
    var sid = sh.getAttribute("data-share");
    var url = sid ? itemAbs({id:sid}) : "https://ourword.ai/skill/tw/";
    var old = sh.textContent;
    function marked(){ sh.textContent = t("shared"); sh.classList.add("on");
      setTimeout(function(){ sh.textContent = old; sh.classList.remove("on"); }, 1400); }
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(url).then(marked, function(){ copyText(url, sh); });
    else copyText(url, sh);
    return;
  }

  var hb = e.target.closest(".heart");
  if(hb){
    e.stopPropagation(); e.preventDefault();
    var on = toggleHeart(hb.getAttribute("data-heart"));
    hb.setAttribute("aria-pressed", on);
    hb.setAttribute("title", t(on?"hearted":"heart"));
    var hc = document.querySelector(".chip.heartchip");
    if(hc) hc.querySelector(".cnt").textContent = hearts().length;
    else renderChips(D.skills||[]);
    if(state.cat === "heart") renderShelf();
    return;
  }

  var chip = e.target.closest("#chips .chip");
  if(chip){ state.cat = chip.getAttribute("data-cat"); state.limit = 60; renderShelf(); window.scrollTo(0,0); return; }

  if(e.target.closest("#sendHearts")){
    e.stopPropagation();
    var ids = hearts();
    var picked = (D.skills||[]).filter(function(x){ return ids.indexOf(x.id)>=0 });
    /* 提交件跟著界面語言走。**這一段原來是寫死中文的**：英文讀者走完
       Mark as good → Hearted → Send to the editor 三步，最後被扔進一個
       標題「心選 3 件」、正文全中文、連商品名都換成 title_zh 的 issue 表單 ——
       那三件他在站上從頭到尾看到的是英文標題，提交出去卻變成他讀不懂的字。
       這是全站唯一一條「讀者交東西給我們」的路，斷在最後一步，也是最貴的一步。
       條目名用 nameOf()，跟他剛才在卡片上讀到的那一行完全一致。 */
    var isEn = lang === "en";
    var nEn = picked.length + (picked.length===1 ? " item" : " items");
    var body = (isEn
        ? "Marked as good by a reader — " + nEn + ".\n"
        + "This is the highest-priority signal: it outranks any machine signal,\n"
        + "and the curation standard should be revisited against it.\n\n"
        : "標記為「好東西」，共 " + picked.length + " 件。\n"
        + "這是最高等級的信號：它高於任何機器信號，應據此回頭改選品標準。\n\n")
      + picked.map(function(x){
          /* URL 不加 ?lang= —— i/ 那批是靜態 SEO 頁，沒有語言開關，
             加了是個不生效的參數，等於對提交人撒一次小謊。 */
          return "- [ ] **"+nameOf(x)+"**  `"+x.repo+"`\n"
               + "      https://ourword.ai/skill/tw/i/"+x.id+"/";
        }).join("\n")
      + (isEn
        ? "\n\n(Generated in the browser by Hearted → Send to the editor. No server; the marks never left this browser until now.)"
        : "\n\n（由站內「心選 → 提交給店長」生成，無服務端，數據只在瀏覽器裡）");
    /* **正文不再塞進 URL。**
       原來是 `?title=…&body=` + encodeURIComponent(body)。中文經過百分號編碼
       每個字變 9 個字符，條目又各帶一行 name + repo + 完整詳情頁 URL ——
       店主標了幾十件之後 GitHub 直接回 **「Your request URL is too long」**，
       標註一件都交不出來。
       **全站唯一一條「讀者交東西給我們」的路，斷在最後一步，也是最貴的一步。**（第二次了。）

       改法：正文寫到剪貼板 + 同時擺在屏幕上，然後只開一個空的 issue 頁。
       URL 從此是常量長度，標多少件都不會再斷。
       **localStorage 裡的標註全程不動** —— 交不出去也不許丟。 */
    var title = isEn ? "Hearted "+nEn : "心選 "+picked.length+" 件";
    var full  = title + "\n\n" + body;
    var panel = el("heartOut");
    if(!panel){
      panel = document.createElement("div");
      panel.id = "heartOut"; panel.className = "heartout";
      document.body.appendChild(panel);
    }
    panel.innerHTML = '<div class="ho-in">'
      + '<p class="ho-tip">'+esc(t("hoTip"))+'</p>'
      + '<textarea readonly rows="10"></textarea>'
      + '<div class="ho-btns">'
      +   '<button type="button" data-ho="copy">'+esc(t("hoCopy"))+'</button>'
      +   '<button type="button" data-ho="issue">'+esc(t("hoIssue"))+'</button>'
      +   '<button type="button" data-ho="close">'+esc(t("hoClose"))+'</button>'
      + '</div></div>';
    panel.querySelector("textarea").value = full;
    panel.classList.add("on");
    var ta = panel.querySelector("textarea");
    ta.focus(); ta.select();
    try{ if(navigator.clipboard) navigator.clipboard.writeText(full); }catch(_){}
    return;
  }

  var ho = e.target.closest("[data-ho]");
  if(ho){
    e.stopPropagation();
    var act = ho.getAttribute("data-ho"), box = el("heartOut");
    if(act === "copy"){
      var ta2 = box.querySelector("textarea");
      ta2.focus(); ta2.select();
      try{ if(navigator.clipboard) navigator.clipboard.writeText(ta2.value); }catch(_){}
      ho.textContent = t("hoCopied");
    } else if(act === "issue"){
      /* 只開空表單，正文靠粘貼 —— URL 裡不帶 body，就不會再「too long」。 */
      window.open("https://github.com/woowoeth/skill/issues/new", "_blank", "noopener");
    } else {
      box.classList.remove("on");
    }
    return;
  }

  if(e.target.closest("#more")){ state.limit += 60; renderShelf(true); return; }

});

document.addEventListener("keydown", function(e){
});

var qt=null;
el("q").addEventListener("input", function(){
  var v = this.value;
  el("searchBox").classList.toggle("has", !!v);
  clearTimeout(qt);
  qt = setTimeout(function(){
    state.q = v; state.limit = 60;
    if(D){ el("main").innerHTML = renderFlow(shelfItems()); armAutoMore(); syncURL(); }
  }, 120);
});
el("clr").addEventListener("click", function(){
  el("q").value=""; el("searchBox").classList.remove("has");
  state.q=""; state.limit=60; el("q").focus();
  if(D) renderShelf(true);
});

el("langBtn").addEventListener("click", function(){
  lang = lang==="zh" ? "en" : "zh";
  var u = new URL(location.href);
  if(lang==="en") u.searchParams.set("lang","en"); else u.searchParams.delete("lang");
  history.replaceState(null,"",u);
  if(SHELF) renderShelf(true); else renderChrome();
});

/* ------------------------------------------------------------------
   9 · 起飛
   ------------------------------------------------------------------
   兩條規矩：

   甲 **首屏不等任何 fetch。** 報頭、標識、立場句、搜索條、頁腳都是靜態 HTML，
      腳本一進來先補文案（renderChrome）。這一屏在第一次繪製就成立。
      v2 是整頁（連報頭）都等四個 fetch 的 Promise.all，再串一個
      methods/*.md —— 五個往返之前頁面上什麼都沒有。

   乙 **整頁只有一個請求：feed.json。** 封面的 URL、類型、真偽、像素寬高
      全在 feed 裡，所以沒有第二個往返、沒有"先無圖再補圖"的二次重排、
      也沒有可選數據把貨架拖住的可能。
   ------------------------------------------------------------------ */
renderChrome();
el("main").innerHTML = '<div class="empty">'+esc(t("loading"))+'</div>';

window.__FEED__.then(function(feed){
  D = feed;
  var _pos = restorePos();
  if(_pos && _pos.limit > state.limit) state.limit = _pos.limit;
  if(state.q){ el("q").value = state.q; el("searchBox").classList.add("has"); }
  renderShelf();
  if(_pos && _pos.y > 0){ requestAnimationFrame(function(){ window.scrollTo(0, _pos.y); }); }
}).catch(function(e){
  el("main").innerHTML = '<div class="empty">'+esc(t("failed"))+'</div>';
  if(window.console) console.error(e);
});

})();
</script>
